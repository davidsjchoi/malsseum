 네가 내가 말한 것보다 더 행할 줄을 아노라 <span class=\"verse-num\">22</span>오직 너는 나를 위하여 숙소를 마련하라 너희 기도로 내가 너희에게 나아갈 수 있기를 바라노라 <span class=\"verse-num\">23</span>그리스도 예수 안에서 나와 함께 갇힌 자 에바브라와 <span class=\"verse-num\">24</span>또한 나의 동역자 마가, 아리스다고, 데마, 누가가 문안하느니라 <span class=\"verse-num\">25</span>우리 주 예수 그리스도의 은혜가 너희 심령과 함께 있을지어다", "exposition": "바울은 빌레몬에게 오네시모를 다시 받아 달라고 간절히 부탁합니다. 오네시모는 빌레몬의 집에서 도망친 노예입니다. 그러나 이후 바울을 통해 복음을 듣고 변화되어 참으로 유익한 사람이 되었습니다. 바울은 사도로서 명령할 수 있는 위치에 있었지만, 그렇게 하지 않습니다. 빌레몬이 스스로 결단하기를 바랐기 때문입니다. 바울은 오네시모가 잠시 떠난 데에도 하나님의 섭리가 있다고 말합니다. 종으로 잠시 잃었지만, 영원한 형제로 다시 얻게 하시려는 하나님의 계획이었다는 것입니다. 오네시모가 빌레몬에게 갚아야 할 빚이 있다면 자기에게 청구하라는 바울의 말은 우리의 죗값을 대신 치르신 예수 그리스도의 사랑을 떠올리게 합니다. 복음은 세상의 모든 신분과 편견의 벽을 허물고, 사람 사이에 새로운 관계를 만들어 냅니다.", "question": "세상의 기준으로 판단할 때 좀처럼 받아들이기 어려운 사람이 있습니까? 그를 그리스도 안에서 사랑받는 형제로 바라본다면 나의 태도는 어떻게 달라져야 할까요?", "prayer": [{"ref": "6절", "verse": "이로써 네 믿음의 교제가 우리 가운데 있는 선을 알게 하고 그리스도께 이르도록 역사하느니라", "body": "이 땅의 모든 교회가 복음 안에서 참된 화해와 하나 됨을 경험하게 하시고, 세상이 감당할 수 없는 사랑의 공동체로 서게 하소서. 갈등과 분열로 신음하는 한국 사회에 그리스도의 평화가 임하게 하시고, 무너진 관계들이 회복되어 하나님 나라가 확장되게 하소서."}, {"ref": "16절", "verse": "이 후로는 종과 같이 대하지 아니하고 종 이상으로 곧 사랑 받는 형제로 둘 자라 내게 특별히 그러하거든 하물며 육신과 주 안에서 상관된 네게랴", "body": "내 안에 있는 편견과 판단의 벽을 허물어 주소서. 사람을 세상의 잣대가 아닌 주님의 눈으로 바라보게 하시고, 용서하기 힘든 이를 용서하며 소외된 이웃을 그리스도 안에서 진정한 형제와 자매로 받아들이는 삶을 살게 하소서."}]}, "2026-08-02": {"sunday": true, "book": "주일", "range": "주일 말씀 기록", "subtitle": "예배에서 받은 한 말씀을 기록합니다", "theme": "주일 예배", "hymn": {"no": "찬송 28장", "title": "복의 근원 강림하사"}}, "2026-08-09": {"sunday": true, "book": "주일", "range": "주일 말씀 기록", "subtitle": "예배에서 받은 한 말씀을 기록합니다", "theme": "주일 예배", "hymn": {"no": "찬송 28장", "title": "복의 근원 강림하사"}}, "2026-08-16": {"sunday": true, "book": "주일", "range": "주일 말씀 기록", "subtitle": "예배에서 받은 한 말씀을 기록합니다", "theme": "주일 예배", "hymn": {"no": "찬송 28장", "title": "복의 근원 강림하사"}}, "2026-08-23": {"sunday": true, "book": "주일", "range": "주일 말씀 기록", "subtitle": "예배에서 받은 한 말씀을 기록합니다", "theme": "주일 예배", "hymn": {"no": "찬송 28장", "title": "복의 근원 강림하사"}}, "2026-08-30": {"sunday": true, "book": "주일", "range": "주일 말씀 기록", "subtitle": "예배에서 받은 한 말씀을 기록합니다", "theme": "주일 예배", "hymn": {"no": "찬송 28장", "title": "복의 근원 강림하사"}}, "2026-09-01": {"book": "스가랴", "chapter": "1장", "range": "스가랴 1장 1~21절", "subtitle": "하나님의 본심", "theme": "하나님의 본심", "hymn": {"no": "찬송 282장 · 큰 죄에 빠진 날 위해", "title": "나의 안에 거하라"}, "maek": "여호와의 말씀이 스가랴에게 임합니다. 그는 이스라엘 조상들이 하나님께 돌아오라는 말씀을 듣고도 악한 길과 행위에서 돌아오지 않았다고 하신 주님의 말씀을 전합니다. 이어서 스가랴는 환상을 봅니다. 먼저는 밤에 붉은 말을 타고 화석류나무 사이에 선 자와 그의 뒤에 붉은 말과 자줏빛 말과 백마가 있는 환상이며, 다음은 네 뿔과 대장장이 네 명이 나오는 환상입니다.", "amsung": {"ref": "슥 1:14", "text": "내게 말하는 천사가 내게 이르되 너는 외쳐 이르기를 만군의 여호와의 말씀에 내가 예루살렘을 위하며 시온을 위하여 크게 질투하며"}, "passage": "<span class=\"verse-num\">1</span>다리오 왕 제이년 여덟째 달에 여호와의 말씀이 잇도의 손자 베레갸의 아들 선지자 스가랴에게 임하니라 이르시되 <span class=\"verse-num\">2</span>여호와가 너희의 조상들에게 심히 진노하였느니라 <span class=\"verse-num\">3</span>그러므로 너는 그들에게 말하기를 만군의 여호와께서 이처럼 이르시되 너희는 내게로 돌아오라 만군의 여호와의 말이니라 그리하면 내가 너희에게로 돌아가리라 만군의 여호와의 말이니라 <span class=\"verse-num\">4</span>너희 조상들을 본받지 말라 옛적 선지자들이 그들에게 외쳐 이르되 만군의 여호와께서 이같이 말씀하시기를 너희가 악한 길, 악한 행위를 떠나서 돌아오라 하셨다 하나 그들이 듣지 아니하고 내게 귀를 기울이지 아니하였느니라 여호와의 말이니라 <span class=\"verse-num\">5</span>너희 조상들이 어디 있느냐 또 선지자들이 영원히 살겠느냐 <span class=\"verse-num\">6</span>내가 나의 종 선지자들에게 명령한 내 말과 내 법도들이 어찌 너희 조상들에게 임하지 아니하였느냐 그러므로 그들이 돌이켜 이르기를 만군의 여호와께서 우리 길대로, 우리 행위대로 우리에게 행하시려고 뜻하신 것을 우리에게 행하셨도다 하였느니라 <span class=\"verse-num\">7</span>다리오 왕 제이년 열한째 달 곧 스밧월 이십사일에 잇도의 손자 베레갸의 아들 선지자 스가랴에게 여호와의 말씀이 임하니라 <span class=\"verse-num\">8</span>내가 밤에 보니 한 사람이 붉은 말을 타고 골짜기 속 화석류나무 사이에 섰고 그 뒤에는 붉은 말과 자줏빛 말과 백마가 있기로 <span class=\"verse-num\">9</span>내가 말하되 내 주여 이들이 무엇이니이까 하니 내게 말하는 천사가 내게 이르되 이들이 무엇인지 내가 네게 보이리라 하니 <span class=\"verse-num\">10</span>화석류나무 사이에 선 자가 대답하여 이르되 이는 여호와께서 땅에 두루 다니라고 보내신 자들이니라 <span class=\"verse-num\">11</span>그들이 화석류나무 사이에 선 여호와의 천사에게 말하되 우리가 땅에 두루 다녀 보니 온 땅이 평안하고 조용하더이다 하더라 <span class=\"verse-num\">12</span>여호와의 천사가 대답하여 이르되 만군의 여호와여 여호와께서 언제까지 예루살렘과 유다 성읍들을 불쌍히 여기지 아니하시려 하나이까 이를 노하신 지 칠십 년이 되었나이다 하매 <span class=\"verse-num\">13</span>여호와께서 내게 말하는 천사에게 선한 말씀, 위로하는 말씀으로 대답하시더라 <span class=\"verse-num\">14</span>내게 말하는 천사가 내게 이르되 너는 외쳐 이르기를 만군의 여호와의 말씀에 내가 예루살렘을 위하며 시온을 위하여 크게 질투하며 <span class=\"verse-num\">15</span>안일한 여러 나라들 때문에 심히 진노하나니 나는 조금 노하였거늘 그들은 힘을 내어 고난을 더하였음이라 <span class=\"verse-num\">16</span>그러므로 여호와가 이처럼 말하노라 내가 불쌍히 여기므로 예루살렘에 돌아왔은즉 내 집이 그 가운데에 건축되리니 예루살렘 위에 먹줄이 쳐지리라 만군의 여호와의 말이니라 <span class=\"verse-num\">17</span>그가 다시 외쳐 이르기를 만군의 여호와의 말씀에 나의 성읍들이 넘치도록 다시 풍부할 것이라 여호와가 다시 시온을 위로하며 다시 예루살렘을 택하리라 하라 하니라 <span class=\"verse-num\">18</span>내가 눈을 들어 본즉 네 개의 뿔이 보이기로 <span class=\"verse-num\">19</span>이에 내게 말하는 천사에게 묻되 이들이 무엇이니이까 하니 내게 대답하되 이들은 유다와 이스라엘과 예루살렘을 흩뜨린 뿔이니라 <span class=\"verse-num\">20</span>그 때에 여호와께서 대장장이 네 명을 내게 보이시기로 <span class=\"verse-num\">21</span>내가 말하되 그들이 무엇하러 왔나이까 하니 대답하여 이르시되 그 뿔들이 유다를 흩뜨려서 사람들이 능히 머리를 들지 못하게 하니 이 대장장이들이 와서 그것들을 두렵게 하고 이전의 뿔들을 들어 유다 땅을 흩뜨린 여러 나라의 뿔들을 떨어뜨리려 하느니라 하시더라", "exposition": "하나님은 돌아오라고 말씀하시며 “그리하면 내가 너희에게로 돌아가리라”라고 약속하십니다. 말씀을 전한 선지자도, 말씀을 들었던 조상들도 영원하지 않지만 주님의 약속은 영원하며 신실합니다. 화석류나무 사이에 선 사람과 말들은 징계 중에도 그 땅을 감찰하시는 하나님의 마음을 보여 줍니다. 주님은 예루살렘과 시온을 몹시 사랑한다고 하시며, 안일한 이방 나라들에는 진노하고 예루살렘을 다시 세우실 것을 약속하십니다. 네 뿔과 네 대장장이 환상 역시 이스라엘에 고통을 준 자들을 하나님이 심판하신다는 선언입니다. 은혜도, 성전 재건도, 승리도 주님이 하십니다. 우리가 할 일은 고통 중에서 회개하고 돌이키는 것입니다. 우리를 사랑하기로 작정하시고 이미 모든 고통과 악을 꺾으신 주님께서 반드시 회복시키고 승리를 고백하게 하실 것입니다.", "question": "내가 주님 앞에 회개할 일은 무엇입니까? 우리의 회복을 위해 기다리시는 주님께 돌이키기 위해 해야 할 일을 구체적으로 결단해 봅시다.", "prayer": [{"ref": "3절", "verse": "그러므로 너는 그들에게 말하기를 만군의 여호와께서 이처럼 이르시되 너희는 내게로 돌아오라 만군의 여호와의 말이니라 그리하면 내가 너희에게로 돌아가리라 만군의 여호와의 말이니라", "body": "하나님을 떠나 세상을 향하던 나의 죄를 용서하소서. 하나님을 만군의 여호와로 알고 고백하면서도 나의 열심과 나의 방식으로 살던 어리석음을 용서하소서. 이제는 주님께로 완전히 돌이키는 참된 회심의 역사가 내 삶에 일어나게 하소서."}, {"ref": "14, 17절", "verse": "내게 말하는 천사가 내게 이르되 너는 외쳐 이르기를 만군의 여호와의 말씀에 내가 예루살렘을 위하며 시온을 위하여 크게 질투하며 … 만군의 여호와의 말씀에 나의 성읍들이 넘치도록 다시 풍부할 것이라 여호와가 다시 시온을 위로하며 다시 예루살렘을 택하리라 하라 하니라", "body": "질투할 만큼 우리를 사랑하시는 하나님을 온전히 사랑하는 삶을 살게 하소서. 우리의 열심과 만족을 위해 살던 방식을 내려놓고 주님이 이루실 일을 신뢰하며 주님만을 사랑하는 -num\">7</span>만군의 여호와의 말씀에 네가 만일 내 도를 행하며 내 규례를 지키면 네가 내 집을 다스릴 것이요 내 뜰을 지킬 것이며 내가 또 너로 여기 섰는 자들 가운데에 왕래하게 하리라 <span class=\"verse-num\">8</span>대제사장 여호수아야 너와 네 앞에 앉은 네 동료들은 내 말을 들을 것이니라 이들은 예표의 사람들이라 내가 내 종 싹을 나게 하리라 <span class=\"verse-num\">9</span>만군의 여호와가 말하노라 내가 너 여호수아 앞에 세운 돌을 보라 한 돌에 일곱 눈이 있느니라 내가 거기에 새길 것을 새기며 이 땅의 죄악을 하루에 제거하리라 <span class=\"verse-num\">10</span>만군의 여호와가 말하노라 그 날에 너희가 각각 포도나무와 무화과나무 아래로 서로 초대하리라 하셨느니라", "exposition": "정결해야 할 대제사장 여호수아가 더러운 옷을 입고 서 있고 사탄은 이를 고발합니다. 이는 성전이 재건되던 당시 주님의 관심이 이스라엘과 주님의 종 된 이들의 거룩함과 순전함에 있음을 보여 줍니다. 재판장이신 하나님은 사탄을 책망하시고, 여호수아의 더러운 옷을 아름다운 옷으로 갈아입히시며 그의 죄를 제거하고 관을 씌우십니다. 나아가 하나님의 종 ‘싹’을 통해 이 땅의 죄를 하루 만에 제거하고, 그날에 완전한 평화를 이룰 것을 약속하십니다. ‘싹’으로 번역된 히브리어 ‘체마흐’는 다윗의 후손으로 오실 메시아를 가리키는 말로, 참된 대제사장으로 오신 예수 그리스도를 의미합니다. 여기서 우리는 우리 죄의 더러움보다 주님의 용서하시는 은혜가 더 크고 깊음을 봅니다. 우리에게 참된 대제사장이 계시며, 용서와 새롭게 살아갈 은혜가 열렸음을 기억해야 합니다.", "question": "죄책감이 마음을 짓누를 때 나의 죄를 사하시고 새로운 날을 열어 주시는 주님을 고백해 봅시다. 그리고 과거의 죄를 돌아보지 않기로 결단합시다.", "prayer": [{"ref": "4~5절", "verse": "여호와께서 자기 앞에 선 자들에게 명령하사 그 더러운 옷을 벗기라 하시고 또 여호수아에게 이르시되 내가 네 죄악을 제거하여 버렸으니 네게 아름다운 옷을 입히리라 하시기로 내가 말하되 정결한 관을 그의 머리에 씌우소서 하매 곧 정결한 관을 그 머리에 씌우며 옷을 입히고", "body": "반복적인 죄와 해결되지 않는 죄책감에 갇힌 나의 마음을 주님 손에 올려 드립니다. 사탄의 참소가 아무리 강해도 죄를 용서하시는 주님의 은혜가 더 크다는 사실을 알게 하소서. 더러운 옷을 벗고 그리스도로 옷 입었음을 기억하며 죄와 죄책감을 이긴 자로 살게 하소서."}, {"ref": "8~9절", "verse": "내가 내 종 싹을 나게 하리라 만군의 여호와가 말하노라 내가 너 여호수아 앞에 세운 돌을 보라 한 돌에 일곱 눈이 있느니라 내가 거기에 새길 것을 새기며 이 땅의 죄악을 하루에 제거하리라", "body": "열방의 죄악을 긍휼히 여기소서. 주님의 약속을 믿지 못하고 좌절하는 이들을 기억하소서. 이들이 하나님은 약속하신 것을 반드시 이루시는 분임을 보게 하소서. 주님의 날에 모든 죄악을 제거하시고 참된 샬롬을 이루소서."}]}, "2026-09-04": {"book": "스가랴", "chapter": "4장", "range": "스가랴 4장 1~14절", "subtitle": "오직 하나님의 영으로", "theme": "오직 하나님의 영으로", "hymn": {"no": "찬송 190장 · 성령이여 강림하사", "title": "하늘의 나는 새도(주 말씀 향하여)"}, "maek": "천사가 스가랴를 깨워 환상을 보여 줍니다. 스가랴는 순금 등잔대를 봅니다. 등잔대 위에는 기름 그릇이 있고, 기름 그릇 위에는 일곱 등잔이 있으며, 그릇 가장자리에는 기름이 공급되는 일곱 개의 관이 연결되어 있습니다. 그리고 등잔대 양옆에는 감람나무가 하나씩 있습니다. 스가랴가 이 환상의 의미를 묻자, 천사는 스룹바벨에게 하신 하나님의 말씀을 전합니다.", "amsung": {" s=\"verse-num\">13</span>내가 불러도 그들이 듣지 아니한 것처럼 그들이 불러도 내가 듣지 아니하리라 만군의 여호와가 말하였느니라 <span class=\"verse-num\">14</span>내가 그들을 바람으로 불어 알지 못하던 여러 나라에 흩었느니라 그 후에 이 땅이 황폐하여 오고 가는 사람이 없었나니 이는 그들이 아름다운 땅을 황폐하게 하였음이니라 하시니라", "exposition": "스가랴는 성전 재건이 한창인 다리오왕 4년에 말씀을 받습니다. 사람들은 제사장들과 선지자들에게 포로기 동안 지켜 온 오월 중의 금식을 계속할지 묻습니다. 하나님은 그들이 금식했던 모습과 동기를 물으십니다. 성전을 다시 쌓으면서도 여전히 자신을 위해 살며 죄를 쌓고 있음을 아시기 때문입니다. 참된 금식을 한 자라면 행할 수 없는 굽은 재판, 약자 압제, 서로 해하는 마음이 그들 가운데 만연했습니다. 주님은 그들이 포로로 끌려갔던 것은 종교 행위는 하면서도 말씀을 듣지 않고 마음을 굳게 했기 때문임을 밝히십니다. 포로에서 돌아와 성전 재건의 은혜를 받았음에도 여전히 완악한 이스라엘의 모습에서, 구원받고 하나님 나라를 세워 갈 자로 부름받았지만 여전히 완악한 우리의 모습을 봅니다. 우리를 대신해 자기 몸을 찢으신 예수님을 의지하길 원합니다.", "question": "나의 예배와 섬김은 온전히 하나님을 향하고 있는지, 하나님이 맡겨 주신 이웃과 영혼을 어떻게 대하고 있는지 돌아봅시다.", "prayer": [{"ref": "5~6절", "verse": "온 땅의 백성과 제사장들에게 이르라 너희가 칠십 년 동안 다섯째 달과 일곱째 달에 금식하고 애통하였거니와 그 금식이 나를 위하여, 나를 위하여 한 것이냐 너희가 먹고 마실 때에 그것은 너희를 위하여 먹고 너희를 위하여 마시는 것이 아니냐", "body": "은혜로 시작했으나 습관이 되어 버린 예배와 모임이 있다면 깨닫게 하소서. 주님을 위한 시간을 나를 위한 시간, 나를 내세우는 시간으로 삼고 있었음을 회개합니다. 철저히 돌이켜 하나님을 위한 것을 하나님께 온전히 드리게 하소서."}, {"ref": "12~13절", "verse": "그 마음을 금강석 같게 하여 율법과 만군의 여호와가 그의 영으로 옛 선지자들을 통하여 전한 말을 듣지 아니하므로 큰 진노가 만군의 여호와께로부터 나왔도다 내가 불러도 그들이 듣지 아니한 것처럼 그들이 불러도 내가 듣지 아니하리라 만군의 여호와가 말하였느니라", "body": "한국 교회의 귀를 열어 주셔서 주님의 말씀을 듣게 하소서. 기록된 말씀과 선포된 말씀, 성령께서 친히 세밀한 음성으로 주시는 말씀을 바르게 듣고 온전히 순종하게 하소서."}]}, "2026-09-09": {"book": "스가랴", "chapter": "8장", "range": "스가랴 8장 1~23절", "subtitle": "만군의 여호와가 이같이 말씀하시다", "theme": "만군의 여호와가 이같이 말씀하시다", "hymn": {"no": "찬송 585장 · 내 주는 강한 성이요", "title": "나의 사랑 너는 어여쁘고(나의 하나님)"}, "maek": "“만군의 여호와가 이같이 말하노라”로 시작되는 열 가지 약속이 이어집니다. 하나님은 시온을 위해 질투하시며, 예루살렘은 진리의 성읍으로 여호와의 산은 성산으로 불릴 것입니다. 하나님은 예루살렘에 은혜를 베푸시고, 백성이 공동체 안에서 하나님이 미워하는 것을 행하지 않기를 바라십니다. 슬픔과 금식은 기쁨과 절기로 바뀌고, 열방이 주님께 돌아올 것입니다.", "amsung": {"ref": "슥 8:3", "text": "여호와가 이같이 말하노라 내가 시온에 돌아와 예루살렘 가운데에 거하리니 예루살렘은 진리의 성읍이라 일컫겠고 만군의 여호와의 산은 성산이라 일컫게 되리라"}, "passage": "<span class=\"verse-num\">1</span>만군의 여호와의 말씀이 임하여 이르시되 <span class=\"verse-num\">2</span>만군의 여호와가 이같이 말하노라 내가 시온을 위 이라 하시니라", "exposition": "하나님은 성전 기둥의 주재료인 레바논의 백향목을 사르게 하십니다. 이에 목자들이 곡합니다. 목자장이신 하나님보다 성전 기둥을 자랑 삼았기 때문입니다. 그들은 땅의 주민을 돌보지 않습니다. 하나님은 거짓 목자를 제거하시고 친히 은총(언약)과 연합(유다와 북 이스라엘의 하나 됨)의 두 막대기로 백성을 목양하십니다. 그런데 하나님을 아는 양들이 그분을 은 서른 개에 팔고, 하나님은 막대기를 꺾으며 못된 목자를 향해 강한 심판을 예고하십니다. 이는 스가랴 시대의 하나님과 목자 그리고 백성의 이야기이며, 더불어 예수님과 그분을 은 서른 개에 판 자의 이야기입니다. 나아가 하나님보다 다른 것을 사랑하고, 우리 죄를 속량하신 주님보다 은을 택하는 우리의 이야기입니다. 그런 우리를 아시면서도 돌이킬 은혜를 주시는 주님을 따르며 선한 길로 나아가기를 원합니다.", "question": "내가 하나님보다 자랑 삼는 것은 무엇입니까? 선한 목자 되신 주님과 온전히 동행하며 더욱더 힘써 사랑해야 할 사람 또는 영역은 무엇인지 생각해 봅시다.", "prayer": [{"ref": "3절", "verse": "목자들의 곡하는 소리가 남이여 그들의 영화로운 것이 쓰러졌음이로다 어린 사자의 부르짖는 소리가 남이여 이는 요단의 자랑이 쓰러졌음이로다", "body": "내 안에 주님과 주님의 나라보다 더 영화롭게 여기고 자랑하는 것이 있음을 깨닫게 하소서. 눈에 보이고, 화려하며, 자랑할 만한 세상 것을 하나님과 겸하여 섬기고자 하는 생각을 버리게 하소서. 세우기도 하시고 일으키기도 하시는 주님만 따라 살게 하소서."}, {"ref": "15, 17절", "verse": "여호와께서 내게 이르시되 너는 또 어리석은 목자의 기구들을 빼앗을지니라 … 화 있을진저 양 떼를 버린 못된 목자여 칼이 그의 팔과 오른쪽 눈에 내리리니 그의 팔이 아주 마르고 그의 오른쪽 눈이 아주 멀어 버릴 것이라 하시니라", "body": "열방의 목회자들과 선교사들을 기억하소서. 은총과 연합으로 돌보길 원하시는 하나님의 마음을 알게 하소서. 세상의 화려하고 인정받는 것이나 자랑할 만한 것 아닌, 목자장이신 주님과 주님이 약속하신 면류관을 바라보며 선한 목자의 사명을 감당하게 하소서."}]}, "2026-09-14": {"book": "스가랴", "chapter": "12장", "range": "스가랴 12장 1~14절", "subtitle": "찌른 자를 바라보며 애통하는 은혜", "theme": "찌른 자를 바라보며 애통하는 은혜", "hymn": {"no": "찬송 151장 · 만왕의 왕 내 주께서", "title": "십자가를 참으신"}, "maek": "창조주 하나님이 예루살렘을 ‘취하게 하는 잔’과 ‘무거운 돌’로 삼아, 공격해 오는 열방을 친히 물리치고 유다와 다윗의 집에 구원과 능력을 더하실 것입니다. 이어서 백성에게 은혜와 간구하는 심령을 부어 주실 것입니다. 백성은 자신들이 ‘찌른 자’를 바라보며 독자를 잃은 듯 크게 애통하되 왕족부터 일반 백성까지 남녀가 각각 따로 애통할 것입니다.", "amsung": {"ref": "슥 12:10", "text": "그들이 그 찌른 바 그를 바라보고 그를 위하여 애통하기를 독자를 위하여 애통하듯 하며 그를 위하여 통곡하기를 장자를 위하여 통곡하듯 하리로다"}, "passage": "<span class=\"verse-num\">1</span>이스라엘에 관한 여호와의 경고의 말씀이라 여호와 곧 하늘을 펴시며 땅의 터를 세우시며 사람 안에 심령을 지으신 이가 이르시되 <span class=\"verse-num\">2</span>보라 내가 예루살렘으로 그 사면 모든 민족에게 취하게 하는 잔이 되게 할 것이라 예루살렘이 에워싸일 때에 유다에까지 이르리라 <span class=\"verse-num\">3</span>그 날에는 내가 예루살렘을 모든 민족에게 무거운 돌이 되게 하리니 그것을 드는 모든 자는 크게 상할 것이라 천하 만국이 그것을 치려고 모이리라 <span class=\"v 니다. 이 목자는 예수 그리스도를 의미합니다. 하나님은 목자를 잃고 흩어진 양들을 불 가운데 던져 연단하실 텐데, 이때 하나님의 이름을 부르는 자를 그분의 백성이라 할 것이라고 약속하십니다. 하나님은 십자가에서 죄와 더러움을 씻는 샘을 여셨습니다. 누구든지 예수님을 믿으면 하나님의 백성이 됩니다. 이는 우리가 받은 은혜입니다. 이 은혜 안에서 살 때, 고난과 유혹이 다가와도 나의 하나님을 고백하게 될 것입니다.", "question": "나의 믿음을 흔드는 고난과 유혹은 무엇입니까? 예수님의 십자가 은혜를 떠올리며 구원의 하나님을 간절히 불러 봅시다.", "prayer": [{"ref": "1~2절", "verse": "그 날에 죄와 더러움을 씻는 샘이 다윗의 족속과 예루살렘 주민을 위하여 열리리라 만군의 여호와가 말하노라 그 날에 내가 우상의 이름을 이 땅에서 끊어서 기억도 되지 못하게 할 것이며 거짓 선지자와 더러운 귀신을 이 땅에서 떠나게 할 것이라", "body": "나를 위해 하나뿐인 아들 예수 그리스도를 십자가에 내어주사 죄와 더러움을 씻는 샘을 여신 주님을 의지합니다. 내 안에 있는 우상과 거짓된 모습, 성령과 관계 없는 더러운 행실과 마음을 보혈로 씻어 주소서. 주님의 약속을 의지하오니 내게서 악이 완전히 떠나게 하소서."}, {"ref": "9절", "verse": "내가 그 삼분의 일을 불 가운데에 던져 은 같이 연단하며 금 같이 시험할 것이라 그들이 내 이름을 부르리니 내가 들을 것이며 나는 말하기를 이는 내 백성이라 할 것이요 그들은 말하기를 여호와는 내 하나님이시라 하리라", "body": "박해와 핍박 가운데 있는 열방의 그리스도인들을 기억하소서. 주님의 이름을 부르는 이들을 친히 구원하소서. 주님의 백성인 그들을 친히 돌보아 주소서. ‘나의 하나님’을 고백하는 그들을 통해 열방이 주님께 돌아오게 하소서."}]}, "2026-09-16": {"book": "스가랴", "chapter": "14장", "range": "스가랴 14장 1~21절", "subtitle": "여호와의 날", "theme": "여호와의 날", "hymn": {"no": "찬송 11장 · 홀로 한 분 하나님께", "title": "주 여호와는 광대하시도다"}, "maek": "여호와의 날에 이방 나라들이 예루살렘에 큰 고통을 주겠지만, 여호와께서 그들을 치실 것입니다. 예루살렘 앞 감람산이 갈라져 골짜기가 되며, 거룩한 자들이 그곳에서 주님과 함께할 것입니다. 그날에는 낮과 밤이 없고, 생수가 흐르고 하나님만 높임받으실 것입니다. 예루살렘을 치거나 하나님을 경배하지 않는 자들은 재앙을 만날 것입니다. 예루살렘과 유다 전역은 거룩한 곳이 될 것입니다.", "amsung": {"ref": "슥 14:9", "text": "여호와께서 천하의 왕이 되시리니 그 날에는 여호와께서 홀로 한 분이실 것이요 그의 이름이 홀로 하나이실 것이라"}, "passage": "<span class=\"verse-num\">1</span>여호와의 날이 이르리라 그 날에 네 재물이 약탈되어 네 가운데에서 나누이리라 <span class=\"verse-num\">2</span>내가 이방 나라들을 모아 예루살렘과 싸우게 하리니 성읍이 함락되며 가옥이 약탈되며 부녀가 욕을 당하며 성읍 백성이 절반이나 사로잡혀 가려니와 남은 백성은 성읍에서 끊어지지 아니하리라 <span class=\"verse-num\">3</span>그 때에 여호와께서 나가사 그 이방 나라들을 치시되 이왕의 전쟁 날에 싸운 것 같이 하시리라 <span class=\"verse-num\">4</span>그 날에 그의 발이 예루살렘 앞 곧 동쪽 감람 산에 서실 것이요 감람 산은 그 한 가운데가 동서로 갈라져 매우 큰 골짜기가 되어서 산 절반은 북으로, 절반은 남으로 옮기고 <span class=\"verse-num\">5</span>그 산 골짜기는 아셀까지 이를지라 너희가 그 산 골짜기로 도망하되 유다 왕 웃시야 때에 지진을 피하여 도망하던 것 같이 하리라 나의 하나님 여호와께서 임하실 것이요 모든 거룩한 자들이 주와 함께 하리라 <span class=\"verse-num\">6</span>그 날에는 빛이 없겠고 광명한 것들이 떠날 것이라 <span class=\"verse-num\">7</span>여호와께서 아시는 한 날이 있으리니 낮도 아니요 밤도 아니라 어두워 갈 때에 빛이 있으리로다 <span class=\"verse-num\">8</span>그 날에 생수가 예루살렘에서 솟아나서 절반은 동해로, 절반은 서해로 흐를 것이라 여름에도 겨울에도 그러하리라 <span class=\"verse-num\">9</span>여호와께서 천하의 왕이 되시리니 그 날에는 여호와께서 홀로 한 분이실 것이요 그의 이름이 홀로 하나이실 것이라 <span class=\"verse-num\">10</span>온 땅이 아라바 같이 되되 게바에서 예루살렘 남쪽 림몬까지 이를 것이며 예루살렘이 높이 들려 그 본처에 있으리니 베냐민 문에서부터 첫 문 자리와 성 모퉁이 문까지 또 하나넬 망대에서부터 왕의 포도주 짜는 곳까지라 <span class=\"verse-num\">11</span>사람이 그 가운데에 살며 다시는 저주가 있지 아니하리니 예루살렘이 평안히 서리로다 <span class=\"verse-num\">12</span>예루살렘을 친 모든 백성에게 여호와께서 내리실 재앙은 이러하니 곧 섰을 때에 그들의 살이 썩으며 그들의 눈동자가 눈구멍 속에서 썩으며 그들의 혀가 입 속에서 썩을 것이요 <span class=\"verse-num\">13</span>그 날에 여호와께서 그들을 크게 요란하게 하시리니 피차 손으로 붙잡으며 피차 손을 들어 칠 것이며 <span class=\"verse-num\">14</span>유다도 예루살렘에서 싸우리니 이 때에 사방에 있는 이방 나라들의 보화 곧 금 은과 의복이 심히 많이 모여질 것이요 <span class=\"verse-num\">15</span>또 말과 노새와 낙타와 나귀와 그 진에 있는 모든 가축에게 미칠 재앙도 그 재앙과 같으리라 <span class=\"verse-num\">16</span>예루살렘을 치러 왔던 이방 나라들 중에 남은 자가 해마다 올라와서 그 왕 만군의 여호와께 경배하며 초막절을 지킬 것이라 <span class=\"verse-num\">17</span>땅에 있는 족속들 중에 그 왕 만군의 여호와께 경배하러 예루살렘에 올라오지 아니하는 자들에게는 비를 내리지 아니하실 것인즉 <span class=\"verse-num\">18</span>만일 애굽 족속이 올라오지 아니할 때에는 비 내림이 있지 아니하리니 여호와께서 초막절을 지키러 올라오지 아니하는 이방 나라들의 사람을 치시는 재앙을 그에게 내리실 것이라 <span class=\"verse-num\">19</span>애굽 사람이나 이방 나라 사람이나 초막절을 지키러 올라오지 아니하는 자가 받을 벌이 그러하니라 <span class=\"verse-num\">20</span>그 날에는 말 방울에까지 여호와께 성결이라 기록될 것이라 여호와의 전에 있는 모든 솥이 제단 앞 주발과 다름이 없을 것이니 <span class=\"verse-num\">21</span>예루살렘과 유다의 모든 솥이 만군의 여호와의 성물이 될 것인즉 제사 드리는 자가 와서 이 솥을 가져다가 그것으로 고기를 삶으리라 그 날에는 만군의 여호와의 전에 가나안 사람이 다시 있지 아니하리라", "exposition": "여호와의 날에 일어날 하나님의 구원과 심판, 그리고 모든 것을 거룩하게 하시는 은혜를 봅니다. 예루살렘과 싸우는 자로부터 살아남은 자들은 하나님이 여신 감람산 골짜기로 피하며, 모든 거룩한 자가 하나님과 함께하게 될 것입니다. 이는 감람산에서 땀이 핏방울이 되도록 기도하시며 십자가로 나아가 구원의 길을 여신 예수님을 가리킵니다. 또 그날에는 예루살렘에서 솟은 생수가 곳곳으로 흘러가며, 예루살렘이 높이 들리고 참된 평안이 임할 것입니다. 주님을 경외하지 않는 이들은 심판을 받으며, 예루살렘과 유다의 모든 것이 성물이 될 것입니다. 이는 성령 =\"verse-num\">15</span>한나가 대답하여 이르되 내 주여 그렇지 아니하니이다 나는 마음이 슬픈 여자라 포도주나 독주를 마신 것이 아니요 여호와 앞에 내 심정을 통한 것뿐이오니 <span class=\"verse-num\">16</span>당신의 여종을 악한 여자로 여기지 마옵소서 내가 지금까지 말한 것은 나의 원통함과 격분됨이 많기 때문이니이다 하는지라 <span class=\"verse-num\">17</span>엘리가 대답하여 이르되 평안히 가라 이스라엘의 하나님이 네가 기도하여 구한 것을 허락하시기를 원하노라 하니 <span class=\"verse-num\">18</span>이르되 당신의 여종이 당신께 은혜 입기를 원하나이다 하고 가서 먹고 얼굴에 다시는 근심 빛이 없더라 <span class=\"verse-num\">19</span>그들이 아침에 일찍이 일어나 여호와 앞에 경배하고 돌아가 라마의 자기 집에 이르니라 엘가나가 그의 아내 한나와 동침하매 여호와께서 그를 생각하신지라 <span class=\"verse-num\">20</span>한나가 임신하고 때가 이르매 아들을 낳아 사무엘이라 이름하였으니 이는 내가 여호와께 그를 구하였다 함이더라 <span class=\"verse-num\">21</span>그 사람 엘가나와 그의 온 집이 여호와께 매년제와 서원제를 드리러 올라갈 때에 <span class=\"verse-num\">22</span>오직 한나는 올라가지 아니하고 그의 남편에게 이르되 아이를 젖 떼거든 내가 그를 데리고 가서 여호와 앞에 뵙게 하고 거기에 영원히 있게 하리이다 하니 <span class=\"verse-num\">23</span>그의 남편 엘가나가 그에게 이르되 그대의 소견에 좋은 대로 하여 그를 젖 떼기까지 기다리라 오직 여호와께서 그의 말씀대로 이루시기를 원하노라 하니라 이에 그 여자가 그의 아들을 양육하며 그가 젖 떼기까지 기다리다가 <span class=\"verse-num\">24</span>젖을 뗀 후에 그를 데리고 올라갈새 수소 세 마리와 밀가루 한 에바와 포도주 한 가죽부대를 가지고 실로 여호와의 집에 나아갔는데 아이가 어리더라 <span class=\"verse-num\">25</span>그들이 수소를 잡고 아이를 데리고 엘리에게 가서 <span class=\"verse-num\">26</span>한나가 이르되 내 주여 당신의 사심으로 맹세하나이다 나는 여기서 내 주 당신 곁에 서서 여호와께 기도하던 여자라 <span class=\"verse-num\">27</span>이 아이를 위하여 내가 기도하였더니 내가 구하여 기도한 바를 여호와께서 내게 허락하신지라 <span class=\"verse-num\">28</span>그러므로 나도 그를 여호와께 드리되 그의 평생을 여호와께 드리나이다 하고 그가 거기서 여호와께 경배하니라", "exposition": "엘가나는 아내인 한나와 브닌나와 함께 매년 실로에 올라가 예배를 드렸습니다. 이는 여호와의 전 문설주 곁에서 의자에 앉아 있던 엘리와 대조적인 모습입니다. 엘가나의 가정에는 아픔이 있었습니다. ‘산호, 진주’를 뜻하는 브닌나에게는 자녀가 있고 ‘은혜’를 뜻하는 한나에게는 자녀가 없었는데, 엘가나가 한나를 세심하게 돌보자 브닌나가 격분해 한나를 괴롭힌 것입니다. 고통 중에 있던 한나는 하나님을 원망하기보다 오히려 그분께 나아가 서원하며 은혜를 구했습니다. 그리고 하나님은 어둠 속에서 빛을 비출 수 없는 산호와 진주보다 귀한 ‘하나님의 등불’과 같은 사무엘을 한나에게서 태어나게 하십니다. 우리가 택할 길은 자랑할 진주가 내게 없음을 낙심하며 믿음을 떠나는 것이 아니라, 믿음으로 기도하며 하나님의 은혜를 구하는 것입니다.", "question": "지금 나를 교만하거나 낙심하게 하는 일은 무엇입니까? 그 일을 하나님 앞에 내려놓고 엎드려 기도하며 은혜를 구합시다.", "prayer": [{"ref": "12~13절", "verse": "그가 여호와 앞에 오래 기도하는 동안에 엘리가 그의 입을 주목한즉 한나가 속으로 말하매 입술만 움직이고 음성은 들리지 아니하므로 엘리는 그가 취한 줄로 생각한지라", "body": "판단하기 좋아하고 쉽게 정죄하는 나의 죄 된 본성을 긍휼히 여기소서. 나의 입술이 주님이 하게 하시는 말을 하며, 나의 말과 행실을 통해 주님을 닮은 성품이 나타나게 하소서. 만나는 이들을 사랑으로 세우는 삶을 살게 하소서."}, {"ref": "20절", "verse": "한나가 임신하고 때가 이르매 아들을 낳아 사무엘이라 이름하였으니 이는 내가 여호와께 그를 구하였다 함이더라", "body": "고통 속에 있는 이들을 긍휼히 여기소서. 그들에게 은혜를 구하며 하나님께 나아갈 믿음과 용기를 주소서. 특별히 오래도록 아이를 바라는 가정을 기억하소서. 믿음으로 기도하는 시간을 통해 그 가정이 어두운 시대에 하나님의 등불과 같은 귀한 가정으로 서게 하소서."}]}, "2026-09-23": {"book": "사무엘상", "chapter": "2장", "range": "사무엘상 2장 1~21절", "subtitle": "경외함으로 서는 자, 멸시함으로 무너지는 자", "theme": "경외함으로 서는 자, 멸시함으로 무너지는 자", "hymn": {"no": "찬송 288장 · 예수를 나의 구주 삼고", "title": "주의 아름다움은 말로 다(주 경외함으로 서리라)"}, "maek": "한나는 하나님이 모든 것의 주인이심을 찬양합니다. 사무엘은 에봇을 입고 하나님 앞에서 섬기며 자랍니다. 반면, 엘리 제사장의 자녀들은 행실이 나쁘고 하나님을 알지 못합니다. 그들은 제사법을 어긴 채 하나님께 드리지 않은 고기를 먼저 취합니다. 그들이 삶은 고기가 아닌 구운 고기를 원했기 때문입니다. 그들의 죄는 하나님을 멸시하고 예배를 멸시하는 데까지 이어집니다.", "amsung": {"ref": "삼상 2:21", "text": "여호와께서 한나를 돌보시사 그로 하여금 임신하여 세 아들과 두 딸을 낳게 하셨고 아이 사무엘은 여호와 앞에서 자라니라"}, "passage": "<span class=\"verse-num\">1</span>한나가 기도하여 이르되 내 마음이 여호와로 말미암아 즐거워하며 내 뿔이 여호와로 말미암아 높아졌으며 내 입이 내 원수들을 향하여 크게 열렸으니 이는 내가 주의 구원으로 말미암아 기뻐함이니이다 <span class=\"verse-num\">2</span>여호와와 같이 거룩하신 이가 없으시니 이는 주 밖에 다른 이가 없고 우리 하나님 같은 반석도 없으심이니이다 <span class=\"verse-num\">3</span>심히 교만한 말을 다시 하지 말 것이며 오만한 말을 너희의 입에서 내지 말지어다 여호와는 지식의 하나님이시라 행동을 달아 보시느니라 <span class=\"verse-num\">4</span>용사의 활은 꺾이고 넘어진 자는 힘으로 띠를 띠도다 <span class=\"verse-num\">5</span>풍족하던 자들은 양식을 위하여 품을 팔고 주리던 자들은 다시 주리지 아니하도다 전에 임신하지 못하던 자는 일곱을 낳았고 많은 자녀를 둔 자는 쇠약하도다 <span class=\"verse-num\">6</span>여호와는 죽이기도 하시고 살리기도 하시며 스올에 내리게도 하시고 거기에서 올리기도 하시는도다 <span class=\"verse-num\">7</span>여호와는 가난하게도 하시고 부하게도 하시며 낮추기도 하시고 높이기도 하시는도다 <span class=\"verse-num\">8</span>가난한 자를 진토에서 일으키시며 빈궁한 자를 거름더미에서 올리사 귀족들과 함께 앉게 하시며 영광의 자리를 차지하게 하시는도다 땅의 기둥들은 여호와의 것이라 여호와께서 세계를 그것들 위에 세우셨도다 <span class=\"verse-num\">9</span>그가 그의 거룩한 자들의 발을 지키실 것이요 악인들을 흑암 중에서 잠잠하게 하시리니 힘으로는 이길 사람이 없음이로다 <span class=\"verse-num\">10</span>여호와를 대적하는 자는 산산이 깨어질 것이라 하늘에 an>백성이 진영으로 돌아오매 이스라엘 장로들이 이르되 여호와께서 어찌하여 우리에게 오늘 블레셋 사람들 앞에 패하게 하셨는고 여호와의 언약궤를 실로에서 우리에게로 가져다가 우리 중에 있게 하여 그것으로 우리를 우리 원수들의 손에서 구원하게 하자 하니 <span class=\"verse-num\">4</span>이에 백성이 실로에 사람을 보내어 그룹 사이에 계신 만군의 여호와의 언약궤를 거기서 가져왔고 엘리의 두 아들 홉니와 비느하스는 하나님의 언약궤와 함께 거기에 있었더라 <span class=\"verse-num\">5</span>여호와의 언약궤가 진영에 들어올 때에 온 이스라엘이 큰 소리로 외치매 땅이 울린지라 <span class=\"verse-num\">6</span>블레셋 사람이 그 외치는 소리를 듣고 이르되 히브리 진영에서 큰 소리로 외침은 어찌 됨이냐 하다가 여호와의 궤가 진영에 들어온 줄을 깨달은지라 <span class=\"verse-num\">7</span>블레셋 사람이 두려워하여 이르되 신이 진영에 이르렀도다 하고 또 이르되 우리에게 화로다 전날에는 이런 일이 없었도다 <span class=\"verse-num\">8</span>우리에게 화로다 누가 우리를 이 능한 신들의 손에서 건지리요 그들은 광야에서 여러 가지 재앙으로 애굽인을 친 신들이니라 <span class=\"verse-num\">9</span>너희 블레셋 사람들아 강하게 되며 대장부가 되라 너희가 히브리 사람의 종이 되기를 그들이 너희의 종이 되었던 것 같이 되지 말고 대장부 같이 되어 싸우라 하고 <span class=\"verse-num\">10</span>블레셋 사람들이 쳤더니 이스라엘이 패하여 각기 장막으로 도망하였고 살륙이 심히 커서 이스라엘 보병의 엎드러진 자가 삼만 명이었으며 <span class=\"verse-num\">11</span>하나님의 궤는 빼앗겼고 엘리의 두 아들 홉니와 비느하스는 죽임을 당하였더라 <span class=\"verse-num\">12</span>당일에 어떤 베냐민 사람이 진영에서 달려나와 자기의 옷을 찢고 자기의 머리에 티끌을 덮어쓰고 실로에 이르니라 <span class=\"verse-num\">13</span>그가 이를 때는 엘리가 길 옆 자기의 의자에 앉아 기다리며 그의 마음이 하나님의 궤로 말미암아 떨릴 즈음이라 그 사람이 성읍에 들어오며 알리매 온 성읍이 부르짖는지라 <span class=\"verse-num\">14</span>엘리가 그 부르짖는 소리를 듣고 이르되 이 떠드는 소리는 어찌 됨이냐 그 사람이 빨리 가서 엘리에게 말하니 <span class=\"verse-num\">15</span>그 때에 엘리의 나이가 구십팔 세라 그의 눈이 어두워서 보지 못하더라 <span class=\"verse-num\">16</span>그 사람이 엘리에게 말하되 나는 진중에서 나온 자라 내가 오늘 진중에서 도망하여 왔나이다 엘리가 이르되 내 아들아 일이 어떻게 되었느냐 <span class=\"verse-num\">17</span>소식을 전하는 자가 대답하여 이르되 이스라엘이 블레셋 사람들 앞에서 도망하였고 백성 중에는 큰 살륙이 있었고 당신의 두 아들 홉니와 비느하스도 죽임을 당하였고 하나님의 궤는 빼앗겼나이다 <span class=\"verse-num\">18</span>하나님의 궤를 말할 때에 엘리가 자기 의자에서 뒤로 넘어져 문 곁에서 목이 부러져 죽었으니 나이가 많고 비대한 까닭이라 그가 이스라엘의 사사가 된 지 사십 년이었더라 <span class=\"verse-num\">19</span>그의 며느리인 비느하스의 아내가 임신하여 해산 때가 가까웠더니 하나님의 궤를 빼앗긴 것과 그의 시아버지와 남편이 죽은 소식을 듣고 갑자기 아파서 몸을 구푸려 해산하고 <span class=\"verse-num\">20</span>죽어갈 때에 곁에 서 있던 여인들이 그에게 이르되 두려워하지 말라 네가 아들을 낳았다 하되 그가 대답하지도 아니하며 관념하지도 아니하고 <span class=\"verse-num\">21</span>이르기를 영광이 이스라엘에서 떠났다 하고 아이 이름을 이가봇이라 하였으니 하나님의 궤가 빼앗겼고 그의 시아버지와 남편이 죽었기 때문이며 <span class=\"verse-num\">22</span>또 이르기를 하나님의 궤를 빼앗겼으므로 영광이 이스라엘에서 떠났다 하였더라", "exposition": "사무엘의 말이 이스라엘에 전파되어 백성이 하나님의 말씀을 듣습니다. 그 무렵 이스라엘이 블레셋과 전쟁하다가 패합니다. 이스라엘 장로들은 전쟁의 시작도 패배의 원인도 하나님께 묻지 않습니다. 패배의 원인을 언약궤의 부재로 보고, 언약궤를 가져와 자신들을 구원하게 하자고 합니다. 하나님의 임재를 자신들을 위한 수단으로 여기는 패악한 믿음이 드러나는 장면입니다. 언약궤가 전장에 도착하자 이스라엘은 기세등등했지만, 전쟁의 승패는 하나님께 있습니다. 이스라엘은 미신적인 종교인이 되어 버렸고 그 결과는 참혹했습니다. 언약궤를 빼앗기고, 엘리와 그의 두 아들은 죽습니다. 비느하스의 아내도 해산 중에 아이의 이름을 ‘이가봇’(하나님의 영광이 떠났다)이라 짓고 숨을 거둡니다. 그러나 떠난 것은 이스라엘이지 하나님이 아닙니다. 돌이키는 것만이 살 길입니다.", "question": "내가 하나님 대신 의지하는 것(예배, 헌금, 봉사, 종교적 습관 등)은 없습니까? 하나님이 아닌 그분의 복과 능력만을 원하고 있지는 않은지 돌아봅시다.", "prayer": [{"ref": "3절", "verse": "백성이 진영으로 돌아오매 이스라엘 장로들이 이르되 여호와께서 어찌하여 우리에게 오늘 블레셋 사람들 앞에 패하게 하셨는고 여호와의 언약궤를 실로에서 우리에게로 가져다가 우리 중에 있게 하여 그것으로 우리를 우리 원수들의 손에서 구원하게 하자 하니", "body": "내 삶에서 습관적인 신앙, 미신적인 신앙의 모습이 있다면 깨닫게 하시고 돌이키게 하소서. 하나님께 묻고, 듣고, 삶으로 순종하는 살아 있는 믿음으로 살게 하소서."}, {"ref": "21~22절", "verse": "이르기를 영광이 이스라엘에서 떠났다 하고 아이 이름을 이가봇이라 하였으니 하나님의 궤가 빼앗겼고 그의 시아버지와 남편이 죽었기 때문이며 또 이르기를 하나님의 궤를 빼앗겼으므로 영광이 이스라엘에서 떠났다 하였더라", "body": "하나님을 떠나 사는 이 세대를 긍휼히 여기소서. 죄로 인한 결과를 하나님이 계시지 않기 때문이라 여기지 않게 하시고, 살아 있는 하나님의 말씀을 듣고 돌이키게 하소서."}]}, "2026-09-28": {"book": "사무엘상", "chapter": "5장", "range": "사무엘상 5장 1~12절", "subtitle": "오직 한 분, 살아 계신 하나님", "theme": "오직 한 분, 살아 계신 하나님", "hymn": {"no": "찬송 449장 · 예수 따라가며", "title": "보이지 않는 영원한 왕"}, "maek": "블레셋 사람들이 하나님의 궤를 빼앗아 아스돗의 다곤 신전에 둡니다. 이튿날 보니 다곤 신상이 엎드러져 있습니다. 다시 세워 두었지만 다음 날 몸뚱이만 남은 채로 엎드러져 있습니다. 하나님의 손이 아스돗을 엄중히 대하십니다. 하나님의 궤를 에그론으로 보내자, 그곳에 독한 종기와 사망의 환난이 임합니다. 이에 블레셋 사람들은 여호와의 궤를 원래 있던 곳으로 돌려보내자고 합니다.", "amsung": {"ref": "삼상 5:6", "text": "여호와의 손이 아스돗 사람에게 엄중히 더하사 독한 종기의 재앙으로 아스돗과 그 지역을 쳐서 망하게 하니"}, "passage": "<span class=\"verse-num\">1</span>블레셋 사람들이 하나님의 궤를 빼앗아 가지고 에벤에셀에서부터 아스돗에 이르니라 <span class=\"verse-num\">2</span>블레셋 사람들이 하나님의 궤를 가지고 다곤의 신전에 들어가서 다곤 곁에 두었더니 <span class=\"verse-num\">3</span>아스돗 사람들이 이튿날 일찍이 일어나 본즉 다곤이 여호와의 궤 앞에서 function ensureSubmissionSeed(){
  const all=_read(STORAGE_KEYS.columnsCustom,null);
  if(all===null){ _write(STORAGE_KEYS.columnsCustom, JSON.parse(JSON.stringify(COLUMN_SUBMISSIONS_SEED))); }
}
function allColumns(){ return _read(STORAGE_KEYS.columnsCustom,{}); }
function listSubmissions(){
  const all=allColumns();
  return Object.keys(all).map(k=>all[k]).filter(c=>c&&!c._deleted&&(c.status==='review'||c.status==='rejected')).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
}
function listPublished(){
  const custom=allColumns(); const merged=[];
  COLUMNS_SEED.forEach(c=>{ const o=custom[c.id]; if(o&&o._deleted)return; merged.push(o?Object.assign({},c,o):c); });
  Object.keys(custom).forEach(id=>{ const c=custom[id]; if(c&&!c._deleted&&parseInt(id,10)>1000&&c.status==='published') merged.push(c); });
  return merged.filter(c=>!c.draft&&c.status!=='review'&&c.status!=='rejected');
}
function approveColumn(id){ const all=allColumns(); if(all[id]){all[id].status='published';all[id].draft=false;delete all[id].rejectReason;all[id].date=new Date().toLocaleDateString('ko-KR');_write(STORAGE_KEYS.columnsCustom,all);} }
function rejectColumn(id,reason){ const all=allColumns(); if(all[id]){all[id].status='rejected';all[id].draft=true;all[id].rejectReason=reason||'';_write(STORAGE_KEYS.columnsCustom,all);} }
function deleteSubmission(id){ const all=allColumns(); if(all[id]){all[id]._deleted=true;_write(STORAGE_KEYS.columnsCustom,all);} }

function listPrayers(){

function addPrayer({who,scope,body,urgent,committee,district,grove,cell}){
  const all=rawPrayers(); const newId=Math.max(0,...all.map(p=>p.id||0))+1;

}

function buildNav(){

/* ── v1.7: 홈 '오늘의 말씀' 사진 관리 (사용자 앱 홈 말씀 박스 배경) ── */
const HOME_PHOTO_DEFAULT = 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1080&q=75';
function getHomePhotoAdmin(){ return _read(STORAGE_KEYS.homePhoto, null); }
function onHomePhotoPick(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = function(e){
    const img = new Image();
    img.onload = function(){
      /* 긴 변 1080px로 축소 + JPEG 압축 → localStorage 용량 보호 */
      const MAX = 1080;
      const scale = Math.min(1, MAX/Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width*scale));
      cv.height = Math.max(1, Math.round(img.height*scale));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      let data;
      try{ data = cv.toDataURL('image/jpeg', 0.82); }catch(err){ data = e.target.result; }
      try{
        _write(STORAGE_KEYS.homePhoto, { img:data, name:f.name, updatedAt:Date.now() });
        toast('사진이 저장되었습니다 — 사용자 앱 홈에 즉시 반영됩니다');
      }catch(err){
        alert('사진 저장에 실패했습니다. 더 작은 사진으로 다시 시도해 주세요.');
      }
      RENDERERS.dashboard();
    };
    img.onerror = function(){ alert('이미지 파일을 읽을 수 없습니다.'); };
    img.src = e.target.result;
  };
  rd.readAsDataURL(f);
}
function clearHomePhoto(){
  if(!confirm('업로드한 사진을 삭제하고 기본 사진으로 되돌릴까요?')) return;
  localStorage.removeItem(STORAGE_KEYS.homePhoto);
  toast('기본 사진으로 되돌렸습니다'); RENDERERS.dashboard();
}

  {"title": "정부의 대북정책에 따른 기도", "team": "", "date": "2026.09.01", "body": "정동영 \"완전한 비핵화 접근 지속 어려워…북미대화 성사시켜야\"\n\n정동영 통일부 장관은 27일 \"과거와 같은 '완전한 비핵화'를 앞세우는 접근은 더는 지속하기 어려운 현실이 분명하다\"고 밝혔다.\n\n정 장관은 이날 중구 웨스틴조선 호텔 서울에서 열린 '2026 국제한반도포럼' 개회사를 통해 북한 핵능력이 1992년 이래 30여년 만에 \"10만배로\" 증대됐다며 이같이 주장했다. 그는 34년 전 북한이 국제원자력기구(IAEA)에 플루토늄 90그램을 추출했다고 신고했지만 34년 후 최근 도널드 트럼프 미국 대통령이 북한에 핵무기 57개를 가졌다고 말한 것을 거론한 뒤 \"이 순간에도 북한의 핵능력은 커지고 있다\"고 지적했다.\n\n그러면서 현재 한반도가 △글로벌 복합위기 △북한의 '적대적 두 국가' 노선 △북한 핵능력 고도화라는 중대한 변화에 직면했다고 진단했다. 정 장관은 특히 \"남북이 서로를 괴뢰라고 부르면서 체제 경쟁에 몰두하던 때에도, 화해와 협력의 시기에도 우리는 분명 하나의 민족이었고 통일을 지향한다는 공통분모는 유지됐다\"며 \"하지만 오늘 북한은 민족과 통일 개념을 지우고 7년 넘게 단절의 시간이 계속되고 있다\"라고 지적했다.\n\n정 장관은 이재명 대통령이 광복절 경축사에서 제시한 '포용적·안정적·책임 있는 평화공존'을 언급하면서 한반도 정전체제를 평화체제로 전환하기 위한 논의가 필요하다고 강조했다. 정 장관은 \"아주 오래된 전쟁을 끝내기 위한 당사자들 간의 논의를 시작하자\"며 \"이를 통해 북한의 핵능력 고도화를 멈출 실효적 방안도 논의될 수 있을 것\"이라고 말했다.\n\n트럼프 대통령의 북미 대화 재개 추진에 대해 정 장관은 \"위기가 아닌 기회의 창이 열리고 있다\"고 진단했다. 정 장관은 \"(이재명 대통령이 트럼프 대통령에게 밝힌) '페이스메이커' 역할은 미국의 움직임을 지켜보면서 가만히 있는 것이 아니라 주도적이고 능동적으로 움직여 공간을 만들고 북미 대화를 성사시키는 것\"이라며 \"그에 그치지 않고 남·북·미·중 4자 대화로 이어지도록 모든 역량을 집중해야 한다\"고 했다.\n\n앞서 통일부는 이달 초 청와대 업무보고에서 남·북·미 중 4자 대화를 통해 한반도 평화체제를 구축한다는 구상을 보고한 바 있다. 당시 조현 외교부 장관은 이에 대해 \"이상주의\"라고 평가하며 온도차를 드러냈지만, 정 장관은 또다시 남·북·미 중 4자 대화 추진 필요성을 역설한 것이다.\n\n정 장관은 \"이재명 대통령이 (광복절 경축사에서) 말한 선제적이고 지속적 평화조치, 신뢰조치를 통해 북미대화와 4자 대화를 촉진하고 범정부 차원에서 한반도 평화체제 논의를 위한 구체적 방안 마련해야 한다\"며, \"유관국들과 전략적으로 소통하고 국내외 평화체제 구축에 대한 공감대를 형성해야 한다\"고 말했다.\n\n이어진 토론세션에 참여한 찰스 쿱찬 미 조지타운대학 교수도 트럼프 대통령의 북미 대화 의지가 강력하다며, 한국이 미리 준비해 기회를 잡으라고 조언했다. 버락 오마바 행정부 시기 백악관 국가안전보장회의에서 대통령 특별보좌관을 지낸 쿱찬 교수는 \"트럼프 대통령이 원하는 것은 정치적 유산을 남기는 것으로, 이를 위해 1기 때보다 북미대화를 더 원할 것\"이라며 \"트럼프 대통령은 김정은(국무위원장)과 대화를 계속 시도할 것이므로 (한국은) 이에 대비해 적극적으로 게임플랜을 마련할 필요가 있다\"고 말했다. <출처: 연합뉴스, 뉴스1>\n\n기도제목\n\n1. 하나님의 말씀을 지키는 자들을 겸손한 자라 부르시는 하나님! 우리 민족이 오직 주를 찾으며, 공의와 겸손을 구하므로 심판의 날에 숨김을 얻는 복을 받게 하소서. 남한과 북한도 하나님을 대적하는 악한 길에서 스스로 돌이키는 은혜가 있게 하시고 전쟁이 없게 하시며 복음으로 평화롭게 통일을 이루게 하소서.\n\n2. 트럼프 대통령의 북미 대화 재개 추진에 정부가 능동적으로 움직여 북미 대화를 성사시키고 남·북·미·중 4자 대화로 이어지도록 모든 역량을 집중해야 한다\"고 합니다. 사람이 계획할지라도 그 걸음을 인도하시는 자는 하나님이십니다. 한반도 문제의 당사자임에도 불구하고 북한과 미국과의 소통 채널이 끊긴 우리나라의 형편을 불쌍히 여기소서. 우리의 대안은 오직 주님뿐 임을 고백합니다. 한국 정부가 먼저 미국과의 소통이 원활히 이루어지게 하시고 하나 되어, 북한과 중국과 외교 하는 길이 열리게 하소서.\n\n3. 통일부 정동영 장관은 이재명 대통령이 광복절 경축사에서 제시한 '포용적·안정적·책임 있는 평화공존'을 언급하면서 한반도 정전체제를 평화체제로 전환하기 위한 논의가 필요하다고 강조했습니다. 북한이 적대적 두 국가와 핵 능력 고도화를 이룬 현 상태에서, 남한이 정전체제를 평화체제로 전환하는 것이 지혜로운 것인지 분별이 되지 않음을 하나님께 올려드립니다. 이재명 대통령과 통일부, 국방부, 외교부 위정자들에게 지혜와 분별력을 주소서. 북한의 동향을 살피며 검증 가능한 평화인지 바르게 판단할 수 있게 하소서. 또한 북한의 도발을 막을 수 있는 국방력을 갖추게 하소서.\n\n4. 주여! 한반도의 통일의 시작과 끝을 인도하소서. 휴전이 결국 종전을 거쳐 평화의 과정으로 가는 한반도 통일전략을 주의 정의와 지혜와 능력으로만 이끄시고, 악한 자들의 계책은 막아주소서. 다윗과 같은 지도자를 세워주셔서 남북한을 하나 되게 하시며 선교완성을 이루는 나라 되게 하소서.\n\n5. 하나님의 놀라운 역사로 진정한 평화를 누릴 수 있는 그날이 남북한에 이루어지게 하소서. 악한 주체사상과 북한 정권과 핵 무력과 적대적 두 국가론이 무너지게 하시고 복음이 한반도 곳곳마다 전해지며 마음껏 예배드리며 자유와 공의가 강같이 흐르는 자유 민주주의 한반도가 되게 하소서.\n\n예수님의 이름으로 기도합니다. 아멘."},
  {"title": "한국교회와 가정이 복음을 삶으로 살아냄으로 믿음의 유산을 이어가게 하소서", "team": "", "date": "2026.08.30", "body": "교회학교 학생 절반 정도만 복음에 확신... 다음세대 신앙 '경고등'\n\n교회학교에 출석하는 중고생 가운데 기독교 복음에 대한 확신이 있다고 응답한 비율이 53%에 그쳤다. 복음에 대한 확신은 부모와의 친밀도가 높거나 가정예배를 정기적으로 드리는 학생일수록 높게 나타났다.\n\n목회데이터연구소(이하 목데연)는 18일 발표한 ‘넘버즈 346호’에서 이 같은 내용을 포함한 주요 조사 결과를 공개했다. 이번 조사는 목데연과 사단법인 꿈이있는미래가 지난해부터 약 1년간 진행한 ‘한국교회 다음세대 트렌드 2026’ 조사에 기반한 것으로, 학생·부모·교사·사역자 등 7개 집단 3,308명을 대상으로 실시됐다.\n\n조사에 따르면 교회에 출석하는 중고생 가운데 55%는 ‘태어날 때부터’ 교회에 출석했다고 응답해 절반 이상이 모태신앙인 것으로 나타났다. 그러나 복음에 대한 확신 여부를 묻는 질문에는 53%가 ‘믿는다’고 응답했다. 성별로는 남학생이 57%, 여학생이 48%였으며, 부모와 친밀한 관계를 가진 학생은 59%, 가정예배를 정기적으로 드리는 학생은 75%로 상대적으로 높은 비율을 보였다.\n\n목데연은 이에 대해 “가족 종교화가 심화되고 출산율 감소 등 다음세대를 둘러싼 환경이 급변하는 상황에서 현재 다음세대의 신앙 위치를 파악할 필요가 있다”며 “부모와의 관계와 가정예배가 복음에 대한 확신과 관련해 상대적으로 높은 비율을 보였다”고 설명했다.\n\n코로나19 이후 예배 회복에서도 성인과 청소년 사이에 차이가 나타났다. 코로나 이전을 100%로 놓고 예배 참석률을 비교한 결과 성인 예배 참석률은 2024년 80% 후반대에서 2026년 5월 94%까지 회복됐지만, 교회학교 예배 참석률은 2024년 1월 81%에서 2026년 5월에도 81%로 같은 수준에 머물렀다.\n\n실제 주일예배 참석 빈도에서도 청소년의 출석률은 성인보다 낮았다. 매주 예배에 참석한다고 응답한 비율은 성인 교회 출석자가 75%인 반면 청소년은 60%로 15%포인트 차이가 났다. 교회학교 학생들의 교회 참여 형태를 보면 ‘예배만 드린다’는 응답이 43%로 가장 많았고, ‘예배와 공과공부까지’가 30%, ‘예배·공과공부·다른 교회활동·친교’가 27%였다.\n\n한편 교회 생활에 대한 전반적인 만족도는 비교적 높았다. 교회 출석 중고생의 64%가 교회 생활에 ‘만족한다’고 응답했으며, 5점 만점 평균은 3.9점이었다. 만족 이유로는 ‘친구’가 41%로 가장 높았고, ‘목사님/전도사님’ 36%, ‘찬양’ 32%가 뒤를 이었다.\n반면 교회 생활에 만족하지 않는 학생들이 꼽은 가장 큰 이유는 ‘교회 프로그램/활동’으로 43%였다. 이어 ‘목사님/전도사님’과 ‘설교’가 각각 27%로 나타났다. 교회학교 교사에 대한 만족도는 61%로, 교회 전반에 대한 만족도 64%보다 3%포인트 낮았다.\n\n신앙 성장에 도움이 된 요인으로는 ‘여름·겨울 수련회’가 42%로 가장 높았으며, ‘찬양’ 39%, ‘설교’ 28%, ‘교회 친구·선후배와의 교제’ 25% 순이었다.\n\n목데연 측은 \"다음세대 신앙의 내실과 교제, 프로그램 전반을 함께 점검해야 할 시점\"이라며 \"복음에 대한 확신이 적고 예배 외 교회활동 참여도도 낮은 만큼, 다음세대 사역의 중심을 단순한 출석 관리에서 신앙의 내실화로 전환할 필요가 있다\"고 밝혔다.\n또한 “청소년들의 신앙적 자극과 성장을 도모하기 위해 수련회 프로그램의 내실화와 찬양 사역의 활성화가 지속적으로 강조될 필요가 있다”고 말했다.\n\n이어 \"가정예배를 정기적으로 드리는 학생에게서 복음에 대한 확신이 상대적으로 높게 나타난 것은 가정과 교회의 연계가 중요하다는 점을 보여준다\"며 가정안에서도 삶가운데 실제적인 복음의 교육이 필요함을 강조했다. <출처: 기독일보>\n\n기도제목\n\n1. 가정에서부터 부모세대인 우리가 다음 세대들에게 세상 가운데 하나님의 자녀로 살아내는 실제적인 믿음의 본이 되게 하소서.\n부모가 먼저 복음으로 살아내는 삶의 선택과 결과의 모든 과정 가운데 하나님과 동행하는 기쁨이 실제가 되게 하시고 마침내 승리하는 삶임을 자녀들에게 보여주게 하셔서 믿음의 유산이 전수되게 하시고 더욱더 깊어지게 하소서.\n\n2. 가정예배가 세상에서의 삶 가운데 지친 가족에게 서로를 향한 사랑과 위로의 시간이 되게 하소서. 가정예배의 시간이 가족 모두가 마음을 열고 하나님 앞에서 말씀을 받고 나누는 시간이 되게 하시고 복음의 확신을 경험하는 시간이 되게 하셔서 다시 새 힘을 얻어 하나님의 자녀로 세상으로 담대하게 나아가게 하소서.\n\n3. 다음세대 안에 성령님의 강력한 역사가 일어나게 하소서. 하나님을 만나고 싶은 갈망이 생기게 하셔서 학생의 때에 예수님을 인격적으로 만나게 하시고, 내가 주인되었던 마음의 중심이 예수님 중심의 신앙으로 거듭나게 하소서.\n\n4. 한국교회의 교회학교 사역자들과 교사들이 하나님께서 부르심 가운데 기쁨과 소명을 느끼게 하소서. 날마다 영과 육이 하나님으로부터 풍성히 공급받게 하셔서 나누고도 소진되지 않도록 하나님의 사랑의 마음을 풍성하게 아이들에게 흘려 보낼 수 있게 하소서.\n\n5. 한국교회가 다음세대들이 복음 안에서 건강한 영성으로 자라갈 수 있도록 체계적이며 지속적인 신앙의 교육과 교제가 이루어지는 데에 힘쓰게 하소서.\n청소년들의 신앙적 자극과 더 깊은 성장을 도모할 수 있도록 예배 이후의 소그룹 교제와 프로그램들을 통해 삶 가운데서의 진실된 나눔이 활성화되게 하시고 수련회 프로그램의 내실화와 찬양 사역의 활성화를 통해 믿음의 동역자와 믿음의 공동체로 함께 자라가게 하소서.\n\n예수님의 이름으로 기도합니다. 아멘."},
  {"title": "드러나는 신천지 정치개입 실체…이단·정치권 유착 고리 끊어야", "team": "", "date": "2026.08.30", "body": "신천지, 당원 가입 첫 시인…전략적 대응 분석도\n\"이번 수사, 유착 끊는 전환점 돼야\"\n\n신천지의 조직적 정치 개입 의혹이 반년 넘게 이어진 수사를 통해 점차 실체를 드러내고 있다. 신천지가 최근 신도들의 국민의힘 당원 가입 사실을 처음 인정하고 사과한 가운데, 이번 사건을 계기로 이단·사이비 단체와 정치권의 유착 구조를 근절해야 한다는 목소리가 커지고 있다.\n\n신천지 총회 본부와 12지파장은 지난 20일 유튜브를 통해 신도들의 국민의힘 당원 가입에 대해 공식 사과했다. 임정환 총회 총무대행은 \"국민의힘 정당 가입으로 사회적 물의를 일으키고 큰 걱정과 심려를 끼쳐드린 점에 대해 머리 숙여 사과드린다\"며 \"정치적 논란을 야기한 데 무거운 책임을 통감한다. 앞으로는 정치권과의 일절 연계를 차단하겠다\"고 밝혔다.\n\n그동안 신천지는 이만희가 당원 가입을 지시하거나 보고받은 사실이 없다며 조직적인 정치 개입 의혹을 부인해 왔다. 그러나 이번 발표에서도 당원 가입 사실만 인정했을 뿐 조직적인 지시 여부나 가입 경위 등 핵심 의혹에 대해서는 별다른 설명을 내놓지 않았다.\n\n반면 수사당국이 파악한 내용은 이와 다르다. 정교유착 비리 검·경 합동수사본부는 신천지가 2021년부터 2024년까지 국민의힘 대선·총선 경선 등에 영향을 미칠 목적으로 '필라테스 프로젝트' 등을 가동해 최소 5만여 명의 신도를 당원으로 가입시킨 것으로 보고 있다. 이만희는 지난 6월 증거인멸 우려로 구속된 뒤 정당법 위반 등의 혐의로 재판에 넘겨졌고, 전·현직 간부들도 잇따라 기소됐다.\n\n지난 1월 시작된 수사는 반년여 만에 여야를 아우르는 정치권 전반으로 확대되는 양상이다.\n\n합수본은 2022년 지방선거를 앞두고 신천지 간부가 더불어민주당 가입도 독려했다는 취지의 진술을 확보한 데 이어, 지난해 고양시장 예비경선 과정에서는 특정 후보 지지와 민원 해결을 위해 신도 30여 명이 민주당에 가입한 정황도 확인했다. 이와 관련해 합수본은 25일 신천지 시몬지파 신학부장과 후보 측 지지자를 공직선거법 위반 혐의로 불구속 기소했다.\n\n갑작스러운 사과 발표를 둘러싼 내부 혼선도 감지된다. 신천지 사정에 밝은 한 관계자는 \"신도들은 서울과 수원, 대구, 청주 등 전국 곳곳에서 이만희 구속 수사의 부당성을 주장하는 전단을 배포해 왔다\"며 \"사과 발표 당일에도 상당수 신도들은 지도부가 당원 가입 사실을 인정하고 사과했다는 사실조차 몰랐던 것으로 보인다\"고 전했다. 이어 \"사과 영상을 보고 충격을 받아 눈물을 흘리는 신도들도 있었고, 일부 지파에서는 전단 배포를 즉시 중단하라는 지시가 내려왔다\"고 덧붙였다.\n\n전문가들은 이번 사과가 수사와 재판이 본격화된 상황에서 이만희의 보석 심문을 하루 앞두고 이뤄졌다는 점에서 전략적 대응 성격이 짙다고 분석했다.\n\n탁지일 부산장신대 교수는 본지와의 통화에서 \"그동안 신천지는 사과보다는 이만희의 고령과 건강 문제, 종교 탄압 등을 앞세운 해명에 집중해 왔다\"며 \"보석 심문을 하루 앞두고 사과에 나선 것은 보석 허가를 염두에 둔 전략적 대응으로 볼 여지가 크다. 실질적인 변화가 뒤따르지 않는다면 보석을 위한 퍼포먼스라는 평가를 피하기 어려울 것\"이라고 지적했다. 탁 교수는 이번 사건을 특정 정당과 신천지의 문제로만 볼 것이 아니라 이단·사이비 단체와 정치권의 유착 구조를 끊는 계기로 삼아야 한다고 강조했다.\n\n그는 \"역사적으로 통일교와 신천지 등 이단·사이비 단체의 정치권 로비는 반복돼 왔다\"며 \"법으로 이를 완전히 차단하기는 쉽지 않지만, 이번 수사를 통해 사이비와 결탁할 경우 결국 부정적인 결과를 초래한다는 사회적 경각심은 커지고 있다\"고 말했다. 그러면서 \"정치권이 이들의 조직력이나 정치자금에 기대지 않는 문화를 만드는 것이 최소한의 안전장치가 될 것\"이라고 강조했다. < 출처 : 데일리굿뉴스>\n\n기도제목\n\n1. 주님, 영적 매너리즘에서 벗어나 먼저 깨어 있게 하소서. 심판의 날을 바라보며 잃어버린 영혼들을 향해 입술만이 아닌 전심과 눈물로 부르짖는 참된 기도자가 되게 하소서.\n\n2. 변하지 않는 현실을 외면했던 불신앙을 회개합니다. 금과 은, 권력을 좇아 정치권과 신천지 등 사이비·이단이 결탁한 모든 악한 고리가 주님의 공의 앞에 깨끗이 끊어지게 하소서.\n\n3. 보이지 않는 영적 실재를 바라볼 수 있도록 영안을 열어주소서. 눈앞의 유익과 세속적 가치만을 좇던 삶을 버리고, 오직 영원한 하나님 나라의 가치를 분별하며 살아가게 하소서.\n\n4. 주님의 심판의 날을 두렵고 떨리는 마음으로 거룩하게 준비하게 하소서. 주께서 세상의 모든 불의와 어둠을 밝히 드러내실 때, 담대히 주권을 선포하며 깨어 기도하게 하소서.\n\n5. 정치권 속에 숨은 모든 뇌물, 비리, 이권 개입의 어둠이 주님의 빛 가운데 밝히 드러나게 하소서. 사리사욕을 채우려는 모든 악한 궤계가 수포로 돌아가고 공정함이 세워지게 하소서. 이 땅의 위정자들이 권력과 탐욕을 내려놓고 하나님과 국민 앞에 정직하게 하소서.\n\n예수님의 이름으로 기도합니다. 아멘."},
  {"title": "하나님의 공의로운 대법관 인선과 대법원·사법부를 위한 기도", "team": "", "date": "2026.08.28", "body": "조희대 대법원장이 18일 대법관 최종 후보로 손봉기(60) 대구지방법원 부장판사와 김성수(57) 서울고등법원 부장판사를 이재명 대통령에게 임명 제청한 것을 두고 청와대 내부에서 불편하다는 기류가 감지되고 있다. 특히 그동안 대통령에게 대면 보고를 해 왔던 관례와 달리, 이번에는 조 대법원장이 서면으로 제청을 한 것으로 알려지면서 여권에서는 \"대통령을 패싱한 것\"이라는 격한 반응이 나오기도 했다.\n\n여권 관계자는 이날 연합뉴스와의 통화에서 \"이번 대법관 후보 임명 제청 과정에서 조 대법원장은 청와대와 충분한 협의를 거치지 않은 것으로 보인다\"며 \"청와대 내에서도 문제가 있다는 인식이 번져있는 것으로 안다\"고 분위기를 전했다. 더군다나 노태악 전 대법관 퇴임으로 공석이 발생한 지 반년 가까이 지나서 후임 대법관 후보를 제청하면서 최소한의 소통이 없었다는 점에서 청와대의 시선은 더욱 곱지 않을 수밖에 없다는 목소리도 나오고 있다.\n\n19일 여당에서는 조 대법원장에 대한 강도 높은 공개 비판을 이어가는 가운데, 법조계 안팎에서는 합의가 이뤄지지 않은 것으로 알려진 노태악 전 대법관 후임 대법관 자리에 대해 후속 절차에 차질은 물론 내년 조 대법원장의 퇴임 때까지 공백인 상황이 계속될 수 있다는 우려가 나온다.\n\n대법원은 전날(18일) \"임기 만료로 퇴임한 노태악 전 대법관의 후임 대법관으로 손봉기 대구지법 부장판사를, 임기 만료로 퇴임하는 이흥구 대법관의 후임 대법관으로 김성수 서울고법 부장판사를 각 임명 제청했다\"고 밝혔다. 이 대통령 취임 이후 첫 대법관 제청이며, 지난 3월 노 전 대법관 퇴임으로 대법관 공백이 생긴 지 5개월 만이다.\n\n앞서 지난 1월 대법관 후보추천위원회는 3월 퇴임을 앞둔 노 전 대법관 후임 후보로 손 부장판사를 비롯해 김민기 서울고법 고법판사와 박순영 서울고법 고법판사, 윤성식 서울고법 부장판사를 추천했다. 그러나 추천 이후 대법원장의 임명 제청이 늦어지면서, 대법원과 청와대의 대법관 후보자에 대한 의견 조율이 이뤄지지 않아 제청 지연으로까지 이어졌다는 분석이 나왔다.\n\n19일 법조계에 따르면 청와대와 사법부는 지난 1월 대법관후보추천위원회가 노태악 전 대법관 후임으로 4명을 추천한 뒤로 최종 후보를 놓고 이견을 보여왔다. 청와대는 이재명 정부 첫 대법관이란 상징성을 고려해 여성이고 진보 성향의 김민기 서울고법 고법판사를 1순위로 고려한 것으로 전해졌다.\n\n대법원은 윤성식 서울고법 부장판사를 우선순위로 고려한 것으로 알려졌지만 윤 부장판사가 무작위 추첨을 거쳐 내란전담재판부 재판장이 되면서 어려워졌다. 김민기 고법판사는 배우자가 현 정부에서 취임한 오영준 헌법재판관이란 점에서 사법부 내부에서 적절치 않다는 분위기가 있었다. 대법원은 또 다른 여성 후보인 박순영 고법판사를 밀었지만 결국 청와대와 합의점을 찾지 못한 것으로 전해진다.\n\n이런 상황에서 대법원이 '제3의 후보'로 손봉기 대구지법 부장판사를 제청한 건 청와대와 협의를 이어가려는 나름의 의지를 보인 것이란 해석도 나온다. 손 부장판사는 원만한 성품으로 이념적 성향이 뚜렷하지 않고, 영남 지역 '향판'에 비서울대 출신이다. 다양성을 고려하면서 제3의 후보를 제시해 청와대와 접점을 찾아보려 한 것 아니냐는 분석이다.\n\n그러나 합의에 이르지 못한 상황에서 내달 이흥구 대법관 퇴임마저 다가오자 더 이상 제청을 미루기 어렵단 판단에 결국 '서면 제청' 카드를 꺼내 들었단 것이다. 현재 노태악 전 대법관 후임 자리가 5개월 넘게 공석이고 이흥구 대법관마저 퇴임하면 재판부 2명 공석 상황이 발생한다.\n\n향후 절차에도 문제가 생겨 조 대법원장의 퇴임 때까지 대법관 공백 사태가 길어질 수 있다는 우려도 나온다. 조 대법관의 임기는 만 70세가 되는 내년 6월 5일이다. 조 대법관이 임명 제청하면 이 대통령이 국회에 대법관 임명동의안을 보내 국회 인사청문회와 본회의 등을 거쳐야 하는데, 이 과정 자체가 이뤄지기 어렵다는 분석도 있다.\n\n헌법상 대법관은 대법원장 제청으로 대통령이 임명하며 국회 동의가 필요하다. 법에는 '대통령과 사전 협의를 거쳐 제청해야 한다'는 규정은 없다. 따라서 이번 제청이 법적으로 불가능한 것은 아니지만 그간 대통령과 협의를 거치는 것이 사실상 관례로 굳어져 있었단 점에서 이례적이다.\n\n이번 제청을 두고 대법원장이 헌법상 부여된 제청권을 실질적으로 행사한 것으로 볼 수 있단 반응도 있다. 특히 대법관 증원으로 이재명 대통령이 향후 새 대법관 22명을 임명할 예정인 만큼, 이번 제청은 향후 대법원 구성 변화에서 청와대와 사법부간 주도권이 어떻게 형성될지 보여줄 가늠자가 될 수 있단 점도 조 대법원장 결단에 영향을 미쳤을 거란 법조계 반응도 나온다.\n\n한편, 2024년 7월 대법원 전원합의체는 동성 동반자의 건강보험 피부양자 자격을 인정하는 취지의 판결을 내린 바 있다. 이를 두고 일부 국민은 해당 판결이 향후 동성혼의 법적 인정으로 이어질 수 있다는 우려를 제기했으며, 국민동의청원에서는 관련 대법관들의 탄핵에 관한 청원이 진행되기도 했다. <출처 : 연합뉴스, 뉴스1, 예수동행기도 외 종합>\n\n기도제목\n\n1. 대법원을 주님의 손에 올려드립니다. 대법관 2명의 인선과 앞으로 진행될 대법관 증원 과정 가운데 모든 압력과 이해관계를 잠잠하게 하시고, 헌법과 양심을 따라 하나님을 경외하는 이들이 세워지게 하소서.\n인선을 논의하고 결정하는 모든 사람에게 지혜와 분별력을 주셔서 정치적 유불리가 아니라 정의와 진리에 합당한 결정을 내리게 하소서.\n\n2. 대법관 인선 과정에 참여하는 모든 이가 내외부의 압력과 회유에 굴하지 않게 하시고, 헌법과 양심에 따라 참된 용기와 분별력을 주셔서 하나님이 기뻐하시는 대법관 인선 과정이 되게 하소서.\n모든 결정의 중심에 여호와 하나님 보시기에 바른 뜻이 세워지게 하시고, 하나님의 법과 헌법의 가치에 합당한 판단을 하는 하나님의 마음에 합한 사람이 세워지게 하소서.\n\n3. 대법원장과 대법관을 비롯한 모든 법조인에게 하나님을 경외하는 마음과 정직한 양심을 부어 주셔서 말씀과 헌법 앞에서 바르게 판단하게 하소서.\n대법원이 권력의 도구가 아니라 정의와 진리를 세우는 기관으로 바로 서게 하시고, 이 나라 위에 공의와 평강을 굳게 세워 주소서.\n\n4. 대법원과 사법부가 어떠한 외부 압력이나 정치적 편향에도 흔들리지 않고 독립성과 공정성을 지키게 하소서.\n모든 재판에서 진실과 공의를 따르게 하시고, 억울한 자와 약한 자를 보호하며 국민에게 신뢰받고 주님 앞에 겸손히 서는 거룩한 사법부가 되게 하소서.\n\n5. 입법부·행정부·사법부의 삼권분립이 온전히 지켜지게 하시고, 각 기관이 서로의 권한을 존중하며 맡겨진 책임을 바르게 감당하게 하소서.\n하나님의 통치 안에서 말씀의 참된 가치를 깨닫고 주님의 법도를 기뻐하게 하시며, 하나님 나라의 질서가 이 땅에 굳게 세워지고 공의와 진리의 기초가 더욱 견고해지게 하소서.\n\n6. 이 나라의 판결과 입법 과정에서 성경적 창조질서와 가정의 가치가 바르게 존중되게 하시고, 진리와 인권을 왜곡하는 모든 시도를 지혜롭게 분별하게 하소서.\n차별과 혐오를 막고 모든 사람의 존엄을 보호하게 하시되, 하나님의 뜻과 공의에 어긋나는 판례와 법안은 바르게 분별하고 바로잡게 하시며, 그리스도께로 돌아와 삶으로 예배드리는 은혜를 입게 하소서.\n\n예수님 이름으로 기도합니다. 아멘"},
  {"title": "식탁에서 시작되는 다음세대의 회복을 위한 기도", "team": "연구팀", "date": "2026.08.28", "body": "◇ 청소년 8명 중 1명, 부모와 일주일에 4차례도 밥 안 먹어\n\n청소년 8명 중 1명은 부모와 함께 식사하는 횟수가 일주일에 4차례도 채 되지 않는 것으로 집계됐다. 청소년이 부모와 함께 식사하는 횟수가 일주일에 1차례 늘어날 때마다 심한 스트레스는 12%, 우울감은 9%, 높은 수준의 불안감은 8% 낮아지는 것으로 나타났다.\n\n16일 질병관리청에 따르면 청소년건강패널조사(2019∼2023) 자료를 활용한 '초기 청소년기의 부모 동반 식사 빈도와 후기 청소년기 정신건강의 종단적 관련성(강주현·김백·김성호)' 연구에서 이 같은 사실이 확인됐다. 청소년건강패널조사는 질병청이 동일 집단을 초등학교 6학년부터 10년간 매년 이들의 건강행태 변화와 선행 요인 등을 파악하는 프로젝트다. 2019년 당시 초등학교 6학년이었던 5천51명을 패널로 구축해 2028년까지 추적한다.\n\n이번 연구는 2019년부터 2023년까지 5년간 모두 조사에 참여한 3천986명을 대상으로 이뤄졌다. 연구팀은 이들이 초기 청소년기(2019∼2020년, 초 6∼중 1)에 부모와 함께한 식사 빈도를 파악한 뒤, 후기 청소년기(2021∼2023년, 중 2∼고1)에 진입했을 때의 스트레스, 우울감 등과 관련이 있는지를 분석했다.\n\n그 결과, 최종 연구 대상자 3천986명 중 부모와 주 4회 미만 식사한 청소년은 전체의 12.9%였다. 부모와 함께하는 식사 횟수가 주 4회 미만인 청소년 집단은 주 4회 이상인 집단에 비해 고소득 가구와 맞벌이 가구의 비율이 높았다. 학업·가정·친구·경제·외모·미래 등 6개 영역에서 전반적으로 심한 스트레스를 느끼는 비율도 높았다. 반면 가족 화목도는 상대적으로 낮은 것으로 조사됐다.\n\n초기 청소년기에 부모와 함께하는 식사 횟수는 이후 정신건강과 연관이 있는 것으로도 확인됐다. 부모와 함께 식사하는 횟수가 일주일에 1번 늘어날 때마다 심한 스트레스는 12%, 우울감은 9%, 높은 수준의 불안감은 8% 낮아지는 경향이 나타났다.\n\n연구팀은 \"이 결과는 부모와 함께하는 식사가 청소년 정신건강을 지지하는 일상적 생활환경 요인이 될 수 있다는 가능성을 시사한다\"며 \"향후 청소년 정신건강 증진을 위한 교육, 상담 및 지역사회 프로그램의 기초자료로 활용될 수 있을 것\"이라고 기대했다. <출처: 데일리굿뉴스>\n\n기도제목\n\n1. 가정 안에 함께하는 식탁과 대화를 회복시켜 주소서.\n바쁜 일정과 학업, 맞벌이 등 여러 현실적인 이유로 가족이 함께하는 시간이 사라지지 않게 하소서. 식탁이 함께 먹는 자리를 넘어 서로의 마음을 나누고 사랑과 소속감을 경험하는 풍성한 교제의 자리가 되게 하소서.\n가정의 식탁이 다음세대의 인성과 정서를 세우는 중요한 교육의 자리임을 우리 사회가 깊이 깨닫게 하소서.\n\n2. 부모들이 자녀와 함께하는 시간을 삶의 중요한 우선순위로 여기게 하소서.\n많은 것을 해주는 것보다 함께 있어 주고, 함께 먹고, 이야기하고, 기도하는 시간이 자녀에게 얼마나 소중한지를 깨닫게 하소서. 부모와 자녀가 건강한 애착과 신뢰의 관계를 이루게 하시고, 부모들이 자녀의 생각과 마음을 깊이 헤아리며 하나님의 사랑을 삶으로 흘려보내는 부모세대가 되게 하소서.\n\n3. 함께할 시간이 부족한 가정마다 지혜와 은혜를 더하여 주소서.\n맞벌이와 여러 환경적인 제약으로 자녀와 충분한 시간을 보내기 어려운 가정들을 특별히 붙들어 주소서. 주어진 상황 속에서도 가족이 함께할 수 있는 지혜를 주시고, 짧은 시간이라도 서로의 마음을 나누며 관계를 세워가게 하소서. 시간의 양보다 함께하는 시간의 깊이를 회복하게 하소서.\n\n4. 다음세대가 함께하는 가정 안에서 사랑과 안정감을 경험하게 하소서.\n다음세대가 혼자 고민하고 혼자 견디지 않게 하시고, 함께 먹고 이야기하고 웃고 울며 기도하는 가정을 허락하소서. 가정에서 사랑받고 존중받으며 소속감과 안정감을 깊이 경험하게 하시고, 그 사랑을 통해 하나님의 사랑을 깨닫고 자신이 하나님 안에서 존귀한 존재임을 알게 하소서.\n\n5. 교회와 사회가 다음세대와 가정을 함께 세워가게 하소서.\n교회가 다음세대의 마음과 가정의 어려움을 함께 품고 기도하며 실제적으로 돕는 공동체가 되게 하소서. 부모와 자녀가 함께할 수 있는 시간을 보장하고 가정의 회복을 돕는 건강한 제도와 사회적 환경이 마련되게 하소서.\n또한 다음세대의 전인적 성장과 내면과 인격의 가치를 중요하게 여기는 사회적 분위기가 형성되게 하시고, 그들이 접하는 미디어 콘텐츠에도 생명과 사랑, 관계의 소중함을 담아내는 선한 변화가 일어나게 하소서.\n\n예수님의 이름으로 기도합니다. 아멘."}
  ],
};

function saveDev(key){
  const custom=_read(STORAGE_KEYS.devotionalsCustom,{})||{};

    if(tv(r)||tv(v)||tv(b)) prayer.push({ref:tv(r),verse:tv(v),body:tv(b)});
  });
  const passage=MSH_PDF_PARSER.verseSpans ? MSH_PDF_PARSER.verseSpans(tv('passage')) : tv('passage');
  const entry={

    hymn:{no:tv('hymnno'), title:tv('hymntitle')},
    hymnLyrics:tv('lyrics'), maek:tv('maek'),
    passage:passage,
    amsung:{ref:tv('amref'), text:tv('amtext')},
    exposition:tv('expo'), question:tv('q'),
    prayer:prayer,
  };
  const bm=entry.range.match(/^[가-힣]+/); if(bm) entry.book=bm[0];

/* ============================================================

/* ============================================================
   말씀함께 책자(펼침 PDF) 추출 엔진 — v1.7.3
   pdf.js textContent 아이템( {str,x,y,w,h} ) 기반.
   관리자와 노드 테스트에서 동일 코드 사용.
   ============================================================ */
(function(global){

function buildLines(items){
  // y를 3pt 단위로 묶어 줄 구성. 줄 안에서 x 간격이 12pt를 넘으면
  // 다른 칼럼(예: 통독 본문 vs 본문)이 겹친 것이므로 세그먼트로 분리.
  var rows={};
  items.forEach(function(it){
    if(!it.str) return;
    var y=Math.round(it.y/3)*3;
    (rows[y]=rows[y]||[]).push(it);
  });
  var out=[];
  Object.keys(rows).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){
    var arr=rows[y].sort(function(a,b){return a.x-b.x;});
    var seg=null, endX=null;
    function flush(){ if(seg && seg.text.replace(/\s/g,'').length) out.push(seg); seg=null; }
    arr.forEach(function(it){
      if(seg===null || (endX!==null && it.x-endX>12)){ flush(); seg={y:y, x0:it.x, h:0, text:''}; endX=null; }
      if(endX!==null && it.x-endX>1.5 && !/\s$/.test(seg.text)) seg.text+=' ';
      seg.text+=it.str;
      endX=it.x+(it.w||0);
      if((it.h||0)>seg.h) seg.h=it.h;
    });
    flush();
  });
  return out;
}
function hangulCount(s){ var m=s.match(/[가-힣]/g); return m?m.length:0; }
function latinCount(s){ var m=s.match(/[A-Za-z]/g); return m?m.length:0; }
function isEnglishLine(l){ return latinCount(l.text) > hangulCount(l.text)*2 && latinCount(l.text)>4; }
function isPageNum(l){ return /^\d{1,3}(\s+\d{1,3})?$/.test(l.text.trim()) && l.y<40; }

function splitHalvesItems(items, W){
  if(W<500) return [items];
  var mid=W/2;
  var L=items.filter(function(i){return i.x<mid;});
  var R=items.filter(function(i){return i.x>=mid;});
  return [L,R];
}

/* 찬양 줄 파싱: "날이 저물어 갈 때(주가 일하시네) / 내 평생에 가는 길(찬 413장)" */
function parseHymn(line){
  var out={no:'', title:''};
  var parts=line.split('/').map(function(s){return s.trim();});
  parts.forEach(function(p){
    var m=p.match(/\(찬\s*(\d+)\s*장\)/);
    if(m){ out.no='찬송 '+m[1]+'장 · '+p.replace(/\(찬\s*\d+\s*장\)/,'').trim(); }
    else if(p) out.title=out.title?out.title+' / '+p:p;
  });
  if(!out.no && !out.title) out.title=line.trim();
  return out;
}

function verseSpans(text){
  return text
    .replace(/\s+/g,' ')
    .replace(/([가-힣”"’)])(\d{1,3})(?=\s?[가-힣“‘"'(])/g,'$1 $2')  /* 붙은 절 번호 분리 */
    .replace(/(^|\s)(\d{1,3})\s?(?=[가-힣“‘"'(])/g, function(_,pre,n){ return (pre?' ':'')+'<span class="verse-num">'+n+'</span>'; })
    .replace(/^\s*<span/,'<span')
    .trim();
}

/* 본문 열(column) 라인 판별: 절 번호가 등장하는 라인들의 x0 최빈값 주변 */
function collectPassage(lines){
  // 개역개정 본문은 이 책자에서 글자 높이 ≈10pt (서술 9pt · 암송 8.5pt · CSB 7.5pt)
  var cand=lines.filter(function(l){
    return !isEnglishLine(l) && l.h>=9.7 && l.h<13 && hangulCount(l.text)>=4
      && !/^\s*[\[\uFF3B]/.test(l.text)
      && !/^(•|□)/.test(l.text.trim())
      && !/말씀암송|맥\s*잡기|오늘의 찬양|통독 본문|말씀해설|말씀기도|말씀먹기|말씀살기|말씀기록/.test(l.text);
  });
  var verseLines=cand.filter(function(l){ return /(^|[\s가-힣”"’)])\d{1,3}\s?[가-힣]/.test(l.text); });
  if(!verseLines.length) return {colX:null, lines:[]};
  var xs={};
  verseLines.forEach(function(l){ var k=Math.round(l.x0/5)*5; xs[k]=(xs[k]||0)+1; });
  var colX=Number(Object.keys(xs).sort(function(a,b){return xs[b]-xs[a];})[0]);
  var out=cand.filter(function(l){ return Math.abs(l.x0-colX)<=14; });
  return {colX:colX, lines:out};
}
function joinKr(lines){
  var s='';
  lines.forEach(function(l){
    var t=l.text;
    if(s && !/\s$/.test(s) && !/^\s/.test(t)){
      // 줄 끝에 공백이 없으면 단어가 잘린 것 — 붙여쓰기
      s+=t;
    }else{
      s+=(s?'':'')+t;
    }
  });
  return s.replace(/\s+/g,' ').trim();
}
/* 공백 보존 조인: 줄 끝 공백 유무로 이어쓰기/붙여쓰기 판단 */
function joinKeep(lines){
  var s='';
  lines.forEach(function(l){ s+=l.text; if(!/\s$/.test(l.text)) s+=''; });
  return s;
}

function parseIntroSpread(halves, dayHint, rawItems){
  var e={_source:'pdf'};
  // 헤더 하프 = '맥 잡기' 포함 하프
  var hi=halves.findIndex(function(h){ return h.some(function(l){return /맥\s*잡기/.test(l.text);}); });
  if(hi<0) return null;
  var H=halves[hi], O=halves[1-hi]||[];

  // 날짜: 큰 글자(높이>=13pt)의 독립 숫자 아이템 (본문 절 번호 h=7~9와 구별)
  var all=H.concat(O);
  var dayNo=null;
  if(rawItems){
    var big=rawItems.filter(function(it){
      var n=parseInt((it.str||'').trim(),10);
      return /^\d{1,2}$/.test((it.str||'').trim()) && (it.h||0)>=13 && n>=1 && n<=31;
    }).sort(function(a,b){ return (b.h||0)-(a.h||0); });
    if(big.length) dayNo=parseInt(big[0].str,10);
  }
  if(!dayNo && dayHint) dayNo=dayHint;
  if(!dayNo) return null;
  e._day=dayNo;

  // 제목: 헤더 하프에서 글자 크기가 가장 큰 한글 줄
  var titleCands=H.filter(function(l){
    var t=l.text.trim();
    if(/^(•|□)/.test(t) || /통독 본문/.test(t)) return false;
    if(/^[월화수목금토일]요일$/.test(t) || /^\d{1,2}$/.test(t)) return false;
    if(/\(찬\s*\d+\s*장\)/.test(t)) return false;
    return hangulCount(t)>=3 && !isEnglishLine(l);
  }).sort(function(a,b){return b.h-a.h;});
  var bigTitles=titleCands.filter(function(l){ return l.h>=13; }).sort(function(a,b){ return b.y-a.y; });
  if(bigTitles.length){
    e.subtitle=bigTitles.map(function(l){ return l.text; }).join(' ')
      .replace(/\s+/g,' ').trim()
      .replace(new RegExp('(^|\\s)0?'+dayNo+'(\\s|$)'),'$1')
      .replace(/^[월화수목금토일]요일\s+/,'')
      .replace(/\s+/g,' ').trim();
  }

  // 찬양
  var hymnLine=all.find(function(l){ return /\(찬\s*\d+\s*장\)/.test(l.text); });
  if(hymnLine) e.hymn=parseHymn(hymnLine.text.replace(/^\s*•?\s*오늘의 찬양\s*/,'').trim());

  // 맥 잡기: 라벨 줄에서 범위, 이후 같은 x열 서술 줄
  var mkIdx=H.findIndex(function(l){ return /맥\s*잡기/.test(l.text); });
  if(mkIdx>=0){
    var mk=H[mkIdx];
    var rm=mk.text.match(/맥\s*잡기\s*[|｜]?\s*(.+)$/);
    if(rm && rm[1].trim()){ e.range=rm[1].replace(/\s+/g,' ').trim(); }
    var maek=[];
    for(var i=mkIdx+1;i<H.length;i++){
      var l=H[i];
      if(l.x0-mk.x0>60) break;                 // 본문 열로 넘어감
      if(/^(•|□|통독)/.test(l.text.trim())) break;
      if(/^\d{1,3}\s+[가-힣]/.test(l.text)) break;
      if(!/[가-힣]/.test(l.text)) break;
      if(maek.length && (maek[maek.length-1].y-l.y)>30) break;  // 큰 간격
      maek.push(l);
    }
    if(maek.length) e.maek=joinKeep(maek).replace(/\s+/g,' ').trim();
    if(e.range){ var bm=e.range.match(/^[가-힣]+/); if(bm) e.book=bm[0]; var cm=e.range.match(/(\d+[편장])/); if(cm) e.chapter=cm[1]; }
  }

  // 말씀암송
  for(var hIdx=0; hIdx<halves.length; hIdx++){
    var HH=halves[hIdx];
    var ai=HH.findIndex(function(l){ return /말씀암송/.test(l.text); });
    if(ai<0) continue;
    var am=HH[ai];
    var ref=(am.text.match(/말씀암송\s*[|｜]?\s*(.+)$/)||[])[1];
    e.amsung={ ref:(ref||'').replace(/\s+/g,' ').trim(), text:'' };
    var t=[], prevY=am.y;
    for(var j=ai+1;j<HH.length;j++){
      var ll=HH[j];
      if(prevY-ll.y>26) break;
      if(/^\d{1,3}\s+[가-힣]/.test(ll.text)) break;
      if(isEnglishLine(ll) || !/[가-힣]/.test(ll.text)) break;
      t.push(ll); prevY=ll.y;
    }
    if(t.length) e.amsung.text=joinKeep(t).replace(/\s+/g,' ').trim();
    break;
  }

  // 본문(개역개정): 헤더 하프 본문 열 + 반대 하프 이어지는 부분(영문 CSB 전까지)
  var hp=collectPassage(H);
  var headLines=hp.lines;
  // 헤더 하프에서는 맥잡기·암송 블록 제외 — 이미 x열 필터로 대부분 제외됨. 추가로 maek/암송에 쓰인 줄 제거
  var op=collectPassage(O);
  var contLines=op.lines;
  if(e.amsung && e.amsung.text){
    contLines=contLines.filter(function(l){ return e.amsung.text.indexOf(l.text.trim())<0; });
  }
  var pass=joinKeep(headLines)+(contLines.length?joinKeep(contLines):'');
  pass=pass.replace(/\s+/g,' ').trim();
  if(pass && /\d/.test(pass)) e._passRaw=pass;
  return e;
}

function parseDetailSpread(halves){
  var e={};
  /* 본문이 길어 해설 페이지 상단까지 이어지는 경우 — 해설 라벨보다 위의 본문 열 수집 */
  var contParts=[];
  halves.forEach(function(h){
    var lab=h.find(function(l){ return /말씀해설/.test(l.text); });
    var subset = lab ? h.filter(function(l){ return l.y>lab.y+4; }) : h;
    var cp=collectPassage(subset);
    if(cp.lines.length) contParts=contParts.concat(cp.lines);
  });
  if(contParts.length) e._passCont=joinKeep(contParts).replace(/\s+/g,' ').trim();
  var all=[]; halves.forEach(function(h){ all=all.concat(h); });
  // 해설이 있는 하프 우선, 없으면 전체
  var hi=halves.findIndex(function(h){ return h.some(function(l){return /말씀해설/.test(l.text);}); });
  var lines=(hi>=0?halves[hi]:all).filter(function(l){
    return !/예수동행기도 홈페이지|예수동행일기|www\./.test(l.text) && !isPageNum(l)
      && !/^말씀먹기|^말씀살기|^말씀기록$/.test(l.text.trim());
  });
  var ei=lines.findIndex(function(l){ return /말씀해설/.test(l.text); });
  var qi=lines.findIndex(function(l){ return /^Q\s*\./.test(l.text.trim()); });
  var pi=lines.findIndex(function(l){ return /^•?\s*말씀기도/.test(l.text.trim()); });
  if(ei>=0){
    var end=qi>ei?qi:(pi>ei?pi:lines.length);
    var expo=lines.slice(ei+1,end).filter(function(l){ return /[가-힣]/.test(l.text) && !isEnglishLine(l); });
    if(expo.length) e.exposition=joinKeep(expo).replace(/\s+/g,' ').trim();
  }
  if(qi>=0){
    var qend=pi>qi?pi:Math.min(qi+4,lines.length);
    var q=lines.slice(qi,qend).map(function(l){return l.text;}).join('');
    e.question=q.replace(/^Q\s*\.\s*/,'').replace(/\s+/g,' ').trim();
  }
  // 말씀기도: 하프에 없으면 다른 하프에서
  var prLines=null;
  for(var k=0;k<halves.length;k++){
    var idx=halves[k].findIndex(function(l){ return /^•?\s*말씀기도/.test(l.text.trim()); });
    if(idx>=0){ prLines=halves[k].slice(idx+1); break; }
  }
  if(!prLines && pi>=0) prLines=lines.slice(pi+1);
  if(prLines){
    var pr=[], cur=null;
    prLines.forEach(function(l){
      var t=l.text.trim();
      if(isPageNum(l) || /예수동행|www\./.test(t)) return;
      var rm=t.match(/^(\d+(?:~\d+)?절)\s*$/);
      if(rm){ cur={ref:rm[1], verse:'', body:''}; pr.push(cur); return; }
      if(!cur) return;
      if(/^[“"]/.test(t)){ cur._q=true; }
      if(cur._q){
        cur.verse+=(cur.verse&&!/\s$/.test(cur.verse)?'':'')+l.text;
        if(/[”"]\s*$/.test(t)){ cur._q=false; }
      }else if(/[가-힣]/.test(t) && !isEnglishLine(l)){
        cur.body+=l.text;
      }
    });
    pr.forEach(function(p){
      p.verse=p.verse.replace(/[“”"]/g,'').replace(/\s+/g,' ').trim();
      p.body=p.body.replace(/\s+/g,' ').trim();
      delete p._q;
    });
    pr=pr.filter(function(p){ return p.body||p.verse; });
    if(pr.length) e.prayer=pr;
  }
  return e;
}

function parseSundaySpread(halves){
  var all=[]; halves.forEach(function(h){ all=all.concat(h); });
  var num=all.filter(function(l){ return /^\d{2}$/.test(l.text.trim()) && !isPageNum(l); })
             .sort(function(a,b){ return b.h-a.h; });
  if(!num.length) return null;
  return { _day:parseInt(num[0].text,10),
    sunday:true, book:'주일', range:'주일 말씀 기록',
    subtitle:'예배에서 받은 한 말씀을 기록합니다', theme:'주일 예배', _source:'pdf' };
}

function parseFwSpread(halves){
  var L=[]; halves.forEach(function(h){ L=L.concat(h); });
  var txt=L.map(function(l){return l.text;}).join('\n');
  var g={};
  var wk=txt.match(/(첫|둘|셋|넷|다섯)째\s*주/); if(wk) g.week=wk[0].replace(/\s+/g,' ');
  var dl=txt.match(/(\d{1,2})일 말씀/); if(dl) g.dayLabel=dl[0];
  var rd=txt.match(/([가-힣]+\s?\d+[편장]\s?\d+~\d+절)\s*\(암송\s*([^)]+)\)/);
  if(rd){ g.reading=rd[1]; g.amsung=rd[2].trim(); }
  var hy=L.find(function(l){ return /^찬양\s+\S/.test(l.text.trim()); });
  if(hy) g.hymn=hy.text.trim().replace(/^찬양\s+/,'');
  // 제목: 큰 글자 한글 줄
  var t=L.filter(function(l){
    var s=l.text.trim();
    return hangulCount(s)>=3 && !/가정예배|말씀 나눔|나눔 질문|축복 기도|예배로의|성경 봉독|가정 미션|주님이 가르쳐/.test(s)
      && !/째\s*주|일 말씀/.test(s);
  }).sort(function(a,b){return b.h-a.h;});
  if(t.length && t[0].h>=12) g.title=t[0].text.replace(/\s+/g,' ').trim();
  function seg(startRe, stopRe){
    var si=L.findIndex(function(l){ return startRe.test(l.text); });
    if(si<0) return '';
    var out=[L[si].text.replace(startRe,'')];
    for(var i=si+1;i<L.length;i++){
      if(stopRe.test(L[i].text)) break;
      if(/^(부\s*름|&\s*암송)$/.test(L[i].text.trim())) continue;
      if(/^[가-힣“‘"'0-9]/.test(L[i].text.trim())) out.push(L[i].text);
      else break;
    }
    return out.join('').replace(/\s+/g,' ').trim();
  }
  g.call=seg(/예배로의\s*(부름)?\s*/, /성경 봉독|말씀 나눔|찬양/);
  g.share=seg(/말씀 나눔\s*/, /나눔 질문/);
  g.question=seg(/나눔 질문\s*/, /축복 기도/);
  g.bless=seg(/축복 기도\s*/, /주님이 가르쳐|가+정+\s*미+션+/);
  g.mission=seg(/가+정+\s*미+션+\s*/, /^\s*\d+\s*$/);
  return (g.week||g.title)?g:null;
}

/* 페이지 배열 → {days:{'d': entry}, fw:[...]} */
function parseBookletPages(pages){
  var days={}, fw=[], lastDay=null;
  pages.forEach(function(pg){
    var halves=splitHalvesItems(pg.items, pg.width).map(buildLines);
    var txt=halves.map(function(h){return h.map(function(l){return l.text;}).join('\n');}).join('\n');
    if(/가\s*정\s*예\s*배/.test(txt) && /성경 봉독/.test(txt) && !/오늘의 찬양/.test(txt)){
      var g=parseFwSpread(halves); if(g) fw.push(g);
      return;
    }
    if(/오늘의 찬양/.test(txt) && /맥\s*잡기/.test(txt) && /말씀암송/.test(txt)){
      var e=parseIntroSpread(halves, lastDay?lastDay+1:null, pg.items);
      if(e && e._day){ var d=e._day; delete e._day; days[d]=Object.assign(days[d]||{}, e); lastDay=d; }
      return;
    }
    if(/주일 말씀/.test(txt) && /내가 받은 한 말씀/.test(txt)){
      var s=parseSundaySpread(halves);
      if(s){ var sd=s._day; delete s._day; days[sd]=Object.assign(days[sd]||{}, s); lastDay=sd; }
      return;
    }
    if(/말씀해설/.test(txt) && lastDay){
      var det=parseDetailSpread(halves);
      var cont=det._passCont; delete det._passCont;
      var cur=days[lastDay]=Object.assign(days[lastDay]||{}, det);
      if(cont && cur._passRaw && cur._passRaw.indexOf(cont.slice(0,20))<0) cur._passRaw+=' '+cont;
      return;
    }
    /* 본문 오버플로 페이지: 라벨 없이 개역개정+CSB만 이어지는 스프레드 */
    if(lastDay && days[lastDay] && days[lastDay]._passRaw){
      var enCnt=0, bigKr=0;
      halves.forEach(function(h){ h.forEach(function(l){
        if(isEnglishLine(l)) enCnt++;
        else if(l.h>=13 && hangulCount(l.text)>=3) bigKr++;
      });});
      /* CSB(영문)가 여러 줄 있고 제목류 큰 글자가 없는, 순수 본문 이어짐 페이지만 */
      if(enCnt>=3 && bigKr===0 && !/가정예배|주일 말씀|오늘의 찬양|말씀기도|단계/.test(txt)){
        var parts=[];
        halves.forEach(function(h){
          var cp=collectPassage(h);
          if(cp.lines.length) parts=parts.concat(cp.lines);
        });
        if(parts.length){
          days[lastDay]._passRaw+=' '+joinKeep(parts).replace(/\s+/g,' ').trim();
        }
      }
    }
  });
  Object.keys(days).forEach(function(d){
    var e=days[d];
    if(e._passRaw){ e.passage=verseSpans(e._passRaw); delete e._passRaw; }
  });
  return {days:days, fw:fw};
}

global.MSH_PDF_PARSER={ parseBookletPages:parseBookletPages, verseSpans:verseSpans };
})(typeof window!=='undefined'?window:module.exports);


async function parseBookletPdf(){
  const f=document.getElementById('pdf-file').files[0];
  const st=document.getElementById('pdf-status');
  if(!f){ toast('PDF 파일을 선택하세요'); return; }
  st.innerHTML='<b>분석 중…</b> pdf.js 로드 및 텍스트 추출';
  try{
    await ensurePdfJs();
    const buf=await f.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:buf}).promise;
    const year=parseInt(document.getElementById('pdf-year').value,10)||2026;
    const month=parseInt(document.getElementById('pdf-month').value,10)||7;
    const pages=[];
    for(let p=1;p<=doc.numPages;p++){
      st.innerHTML='<b>분석 중…</b> '+p+' / '+doc.numPages+' 페이지';
      const pg=await doc.getPage(p);
      const vp=pg.getViewport({scale:1});
      const tc=await pg.getTextContent();
      pages.push({width:vp.width, items:tc.items.map(i=>({str:i.str, x:i.transform[4], y:i.transform[5], w:i.width, h:i.height}))});
    }
    st.innerHTML='<b>분석 중…</b> 날짜별 본문 구성';
    const r=MSH_PDF_PARSER.parseBookletPages(pages);
    const list=Object.keys(r.days).map(Number).sort((a,b)=>a-b).map(d=>({dateKey:_dk(year,month,d), entry:r.days[d]}));
    _pdfParsed={list, year, month, fw:(r.fw||[])};
    st.innerHTML='<b>분석 완료</b> — 매일 묵상 '+list.length+'일 · 가정예배 '+(r.fw||[]).length+'주 인식';
    renderPdfResult();
  }catch(err){
    st.innerHTML='<b style="color:var(--bad,#c0392b)">오류:</b> '+esc(err.message);
  }
}
function _dk(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(parseInt(d,10)).padStart(2,'0'); }

function renderPdfResult(){
  const el=document.getElementById('pdf-result');
  if(!_pdfParsed||!_pdfParsed.list.length){ el.innerHTML=emptyBox('인식된 묵상이 없습니다. 내지(펼침) PDF인지 확인하세요.'); return; }
  el.innerHTML=`
    <div class="section-title">2. 인식 결과 확인 (${_pdfParsed.list.length}일)</div>
    ${_pdfParsed.list.map((d,i)=>{
      const e=d.entry;
      const ok=[e.subtitle&&'제목', e.range&&'본문범위', e.hymn&&'찬양', e.amsung&&e.amsung.ref&&'암송', e.maek&&'맥잡기', e.passage&&'본문', e.exposition&&'해설', e.question&&'질문', e.prayer&&e.prayer.length&&'기도', e.sunday&&'주일'].filter(Boolean);
      return `<div class="lrow">
        <div class="lrow-av" style="background:var(--sage-pale,#eef3ee);color:var(--sage-dark,#3c5c4c);font-size:11px">${d.dateKey.slice(5)}</div>
        <div class="lrow-main">
          <div class="lrow-title">${esc(e.subtitle||'(주일)')}</div>
          <div class="lrow-sub">${esc(e.range||'')} · 인식된 항목: ${ok.join(', ')||'-'}</div>
        </div>
        <div class="lrow-actions"><label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" class="pdf-apply" data-i="${i}" checked> 반영</label></div>
      </div>`;
    }).join('')}
    ${(_pdfParsed.fw&&_pdfParsed.fw.length)?`
      <div class="section-title">온 세대 가정예배 (${_pdfParsed.fw.length}주 인식)</div>
      ${_pdfParsed.fw.map((w,i)=>`<div class="lrow">
        <div class="lrow-av" style="background:var(--sage-pale,#eef3ee);color:var(--sage-dark,#3c5c4c);font-size:10.5px">${esc(w.week||(i+1)+'주')}</div>
        <div class="lrow-main"><div class="lrow-title">${esc(w.title||'(제목 미인식)')}</div>
          <div class="lrow-sub">${esc(w.dayLabel||'')} · ${esc(w.reading||'')} · 암송 ${esc(w.amsung||'')}</div></div>
        <div class="lrow-actions"><label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" class="fw-apply" data-i="${i}" checked> 반영</label></div>
      </div>`).join('')}`:''}
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button class="btn btn-primary" onclick="applyPdfToApp()">3. 선택 항목을 앱에 반영</button>
      <span class="hint" style="margin:0">기존 시드/편집 내용 위에 병합됩니다. ‘묵상 본문’ 메뉴에서 개별 수정할 수 있습니다.</span>
    </div>`;
}

function applyPdfToApp(){
  if(!_pdfParsed) return;
  const custom=_read(STORAGE_KEYS.devotionalsCustom,{})||{};
  let n=0;
  document.querySelectorAll('.pdf-apply:checked').forEach(cb=>{
    const d=_pdfParsed.list[parseInt(cb.dataset.i,10)];
    if(!d) return;
    custom[d.dateKey]=Object.assign({},custom[d.dateKey]||{},d.entry);
    n++;
  });
  _write(STORAGE_KEYS.devotionalsCustom,custom);
  // 가정예배 반영
  let fwN=0;
  const fwSel=[];
  document.querySelectorAll('.fw-apply:checked').forEach(cb=>{
    const w=(_pdfParsed.fw||[])[parseInt(cb.dataset.i,10)];
    if(w){ fwSel.push(w); fwN++; }
  });
  if(fwN){
    const mk=_pdfParsed.year+'-'+String(_pdfParsed.month).padStart(2,'0');
    saveFwMonth(mk, fwSel);
  }
  toast(n+'일 묵상'+(fwN?(' · 가정예배 '+fwN+'주'):'')+'가 앱에 반영되었습니다 ✅');
  go('devotional');
}
